# Server configuration
quarkus.http.port=8090
quarkus.application.name=quarkus-broker-gateway

# Logging
quarkus.log.level=INFO
quarkus.log.category."com.angrysurfer.quarkus.nexus".level=DEBUG

# REST Client configuration (for calling other services)
# Env-driven for multi-machine deployment (fallbacks = single-machine defaults).
quarkus.rest-client.prod-api.url=${BROKER_GATEWAY_URL:http://localhost:8081}

# External services configuration
external.services.urls.user-service=${USER_SERVICE_URL:http://localhost:8083}
external.services.urls.login-service=${LOGIN_SERVICE_URL:http://localhost:8082}
external.services.urls.file-service=${FILE_SERVICE_URL:http://localhost:8081}
external.services.urls.search-service=${SEARCH_SERVICE_URL:http://localhost:8084}

# External API client configuration
quarkus.rest-client.external-api.url=${BROKER_GATEWAY_URL:http://localhost:8081}

# Service Registry Registration
service.registry.url=${SERVICE_REGISTRY_URL:http://localhost:8085}
service.host=${SERVICE_HOST:localhost}
registration.enabled=true
heartbeat.interval.seconds=30
