# docker/vanadium — the vanadium failover tier manifest.
# Operator scope 2026-08-22: the 17 .directory-marked typescript servers
# + jvm/spring/service-registry (+ service-broker and jvm/spring/peb-kernel
# once built). Container names prefixed vd-; host ports via *_HOST_PORT env
# so the same file serves local smoke tests (offset ports) and vanadium.
name: nexus-vanadium-tier

services:
  wind:
    build:
      context: ../../typescript
      dockerfile: wind-srv/Dockerfile
    container_name: legacy-wind
    restart: unless-stopped
    environment:
      WIND_SRV_PORT: ${WIND_SRV_PORT:-3300}
      NEXUS_PG_DSN: ${NEXUS_PG_DSN}
    ports:
      - "${WIND_HOST_PORT:-3300}:3300"
  tackle:
    build:
      context: ../../typescript
      dockerfile: tackle-srv/Dockerfile
    container_name: legacy-tackle
    restart: unless-stopped
    environment:
      TACKLE_SRV_PORT: ${TACKLE_SRV_PORT:-3410}
      TACKLE_PG_DSN: ${TACKLE_PG_DSN}
      CONDUIT_PG_DSN: ${CONDUIT_PG_DSN}
      MEMORY_REDIS_URL: ${MEMORY_REDIS_URL}
      MEMORY_SRV_URL: ${MEMORY_SRV_URL:-http://legacy-memory:3500}
      PIPELINE_ROOT: ${PIPELINE_ROOT:-/nexus}
    ports:
      - "${TACKLE_HOST_PORT:-3410}:3410"
  kernel:
    build:
      context: ../../typescript
      dockerfile: kernel-srv/Dockerfile
    container_name: legacy-kernel
    restart: unless-stopped
    environment:
      PORT: ${KERNEL_SRV_PORT:-8100}
      DB_HOST: ${PG_HOST:-postgres}
      DB_PORT: ${PG_PORT:-5432}
      DB_USER: ${PG_USER:-pguser}
      DB_PASS: ${PG_PASS:-pgpass}
      DB_NAME: ${PG_DB_NAME:-nexus}
    ports:
      - "${KERNEL_HOST_PORT:-8100}:8100"
  peb:
    build:
      context: ../../typescript
      dockerfile: peb-srv/Dockerfile
    container_name: legacy-peb
    restart: unless-stopped
    environment:
      PEB_SRV_PORT: ${PEB_SRV_PORT:-3111}
      PEB_PG_DSN: ${PEB_PG_DSN}
    ports:
      - "${PEB_HOST_PORT:-3111}:3111"
  cascade:
    build:
      context: ../../typescript
      dockerfile: cascade-srv/Dockerfile
    container_name: legacy-cascade
    restart: unless-stopped
    environment:
      PORT: ${CASCADE_SRV_PORT:-3106}
      DB_HOST: ${PG_HOST:-postgres}
      DB_PORT: ${PG_PORT:-5432}
      DB_USER: ${PG_USER:-pguser}
      DB_PASS: ${PG_PASS:-pgpass}
      DB_NAME: ${PG_DB_NAME:-nexus}
    ports:
      - "${CASCADE_HOST_PORT:-3106}:3106"
  harness:
    build:
      context: ../../typescript
      dockerfile: harness-srv/Dockerfile
    container_name: legacy-harness
    restart: unless-stopped
    environment:
      HARNESS_PORT: ${HARNESS_SRV_PORT:-3420}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      HARNESS_WORK_DIR: ${HARNESS_WORK_DIR:-/nexus}
      NEXUS_LOG_DIR: ${NEXUS_LOG_DIR:-/nexus/logs}
      OPENCODE_BIN: ${OPENCODE_BIN:-opencode}
      OLLAMA_URL: ${OLLAMA_URL:-http://localhost:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      PG_HOST: ${PG_HOST:-postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_DATABASE: ${PG_DB_NAME:-nexus}
      PG_USER: ${PG_USER:-pguser}
      PG_PASSWORD: ${PG_PASS:-pgpass}
      NEBULA_URL: ${NEBULA_URL:-http://legacy-nebula:3101}
      CONDUIT_MCP_URL: ${CONDUIT_MCP_URL:-http://legacy-conduit:3100}
      NEXUS_PG_DSN: ${NEXUS_PG_DSN}
    volumes:
      - ${HARNESS_WORK_DIR:-./work}:/nexus
    ports:
      - "${HARNESS_HOST_PORT:-3420}:3420"
  pty:
    build:
      context: ../../typescript
      dockerfile: pty-srv/Dockerfile
    container_name: legacy-pty
    restart: unless-stopped
    environment:
      PTY_SRV_PORT: ${PTY_SRV_PORT:-3120}
      PTY_HOST: ${PTY_HOST:-127.0.0.1}
    ports:
      - "${PTY_HOST_PORT:-3120}:3121"
  execution:
    build:
      context: ../../typescript
      dockerfile: execution-srv/Dockerfile
    container_name: legacy-execution
    restart: unless-stopped
    environment:
      PORT: ${EXECUTION_SRV_PORT:-3110}
      PGHOST: ${PG_HOST:-postgres}
      PGPORT: ${PG_PORT:-5432}
      PGUSER: ${PG_USER:-pguser}
      PGPASSWORD: ${PG_PASS:-pgpass}
      PGDATABASE: ${PG_DB_NAME:-nexus}
    ports:
      - "${EXECUTION_HOST_PORT:-3110}:3110"
  prompt-sync:
    build:
      context: ../../typescript
      dockerfile: tackle-prompt-sync-srv/Dockerfile
    container_name: legacy-prompt-sync
    restart: unless-stopped
    environment:
      PROMPT_SRV_PORT: ${PROMPT_SRV_PORT:-3501}
      PROMPT_PG_DSN: ${PROMPT_PG_DSN}
      PROMPT_REDIS_URL: ${PROMPT_REDIS_URL:-redis://redis:6379}
      TACKLE_PG_DSN: ${TACKLE_PG_DSN}
      CONDUIT_PG_DSN: ${CONDUIT_PG_DSN}
      MEMORY_REDIS_URL: ${MEMORY_REDIS_URL}
    ports:
      - "${PROMPT_HOST_PORT:-3501}:3501"
  memory:
    build:
      context: ../../typescript
      dockerfile: role-memory-srv/Dockerfile
    container_name: legacy-memory
    restart: unless-stopped
    environment:
      MEMORY_SRV_PORT: ${MEMORY_SRV_PORT:-3500}
      MEMORY_PG_DSN: ${MEMORY_PG_DSN}
      MEMORY_REDIS_URL: ${MEMORY_REDIS_URL:-redis://redis:6379}
      CONDUIT_PG_DSN: ${CONDUIT_PG_DSN}
    ports:
      - "${MEMORY_HOST_PORT:-3500}:3500"
  assembly:
    build:
      context: ../../typescript
      dockerfile: assembly-srv/Dockerfile
    container_name: vd-assembly
    restart: unless-stopped
    environment:
      PORT: ${ASSEMBLY_HOST_PORT:-3107}
      NEXUS_PG_DSN: ${NEXUS_PG_DSN}
    ports:
      - "${ASSEMBLY_HOST_PORT:-3107}:3107"
  conduit:
    build:
      context: ../../typescript
      dockerfile: conduit-srv/Dockerfile
    container_name: vd-conduit
    restart: unless-stopped
    environment:
      CONDUIT_SRV_PORT: ${CONDUIT_HOST_PORT:-3104}
      CONDUIT_PG_DSN: ${CONDUIT_PG_DSN}
    ports:
      - "${CONDUIT_HOST_PORT:-3104}:3104"
  knowledge:
    build:
      context: ../../typescript
      dockerfile: knowledge-srv/Dockerfile
    container_name: vd-knowledge
    restart: unless-stopped
    environment:
      PORT: ${KNOWLEDGE_HOST_PORT:-3109}
    ports:
      - "${KNOWLEDGE_HOST_PORT:-3109}:3109"
  nebula:
    build:
      context: ../../typescript
      dockerfile: nebula-srv/Dockerfile
    container_name: vd-nebula
    restart: unless-stopped
    environment:
      NEBULA_PORT: ${NEBULA_HOST_PORT:-3101}
    ports:
      - "${NEBULA_HOST_PORT:-3101}:3101"
  semantics:
    build:
      context: ../../typescript
      dockerfile: semantics-srv/Dockerfile
    container_name: vd-semantics
    restart: unless-stopped
    environment:
      SEMANTICS_SRV_PORT: ${SEMANTICS_HOST_PORT:-3160}
      SEMANTICS_PG_DSN: ${SEMANTICS_PG_DSN}
    ports:
      - "${SEMANTICS_HOST_PORT:-3160}:3160"
  terrain-ts:
    build:
      context: ../../typescript/terrain-srv
    container_name: vd-terrain-ts
    restart: unless-stopped
    environment:
      PORT: ${TERRAIN_TS_HOST_PORT:-8086}
    ports:
      - "${TERRAIN_TS_HOST_PORT:-8086}:8084"
  voyager:
    build:
      context: ../../typescript
      dockerfile: voyager-srv/Dockerfile
    container_name: vd-voyager
    restart: unless-stopped
    environment:
      PORT: ${VOYAGER_HOST_PORT:-3114}
    ports:
      - "${VOYAGER_HOST_PORT:-3114}:3114"
  service-registry:
    image: nexus-vanadium/service-registry
    build:
      context: ../../jvm
      dockerfile: spring/service-registry/Dockerfile
    container_name: vd-service-registry
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${PG_HOST}:${PG_PORT}/${PG_DB_NAME}?currentSchema=registry
      SPRING_DATASOURCE_USERNAME: ${PG_USER}
      SPRING_DATASOURCE_PASSWORD: ${PG_PASS}
      SPRING_DATA_REDIS_HOST: ${REGISTRY_REDIS_HOST:-172.17.0.1}
    ports:
      - "${REGISTRY_HOST_PORT:-8085}:8085"
