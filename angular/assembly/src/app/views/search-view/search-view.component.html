<div class="max-w-4xl mx-auto">
  <app-page-header title="Search" [description]="description()" [count]="filteredResults().length"></app-page-header>

  <div class="app-panel mb-6">
    <form (submit)="$event.preventDefault(); search(query())" class="flex items-center gap-3" aria-label="Search Assembly">
      <div class="relative flex-1">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-steel-400 dark:text-steel-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input id="assembly-search" type="text" [value]="query()" (input)="query.set($any($event).target.value)" name="q" placeholder="Search across all entities..." class="w-full pl-10 pr-4 py-2 text-sm bg-white dark:bg-steel-900 border border-steel-200 dark:border-steel-700 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-steel-900 dark:text-steel-100 placeholder-steel-400 dark:placeholder-steel-500">
      </div>
      <button type="submit" class="px-4 py-2 text-sm font-medium bg-primary-600 hover:bg-primary-700 text-white rounded-md transition-colors">Search</button>
    </form>
  </div>

  <app-error-state *ngIf="error() && !loading()" title="Search failed" [description]="error()!" (retry)="search(query())"></app-error-state>

  <ng-container *ngIf="!loading() && !error()">
    <app-empty-state *ngIf="query().length === 0" title="Start typing" description="Enter at least 2 characters to search across Assembly."></app-empty-state>

    <app-empty-state *ngIf="query().length > 0 && filteredResults().length === 0 && results().length === 0" title="No results" [description]="'No matches found for ' + query() + '.'"></app-empty-state>

    <ng-container *ngIf="query().length > 0 && results().length > 0">
      <div class="mb-4 flex items-center justify-between flex-wrap gap-2">
        <p class="text-xs text-steel-500 dark:text-steel-400">
          Showing <span class="font-medium text-steel-700 dark:text-steel-200">{{ filteredResults().length }}</span> of <span class="font-medium text-steel-700 dark:text-steel-200">{{ total() }}</span> matches
        </p>
        <button *ngIf="selectedTypes().size > 0" (click)="clearFilters()" class="text-xs text-primary-600 dark:text-primary-400 hover:text-primary-700 dark:hover:text-primary-300 transition-colors">Clear filters</button>
      </div>

      <div *ngIf="typeEntries().length > 0" class="flex flex-wrap gap-2 mb-4">
        <button
          *ngFor="let entry of typeEntries()"
          (click)="toggleType(entry.type)"
          class="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs font-medium rounded-full border transition-colors"
          [class.bg-primary-50]="isSelected(entry.type)"
          [class.dark:bg-primary-900/30]="isSelected(entry.type)"
          [class.border-primary-200]="isSelected(entry.type)"
          [class.dark:border-primary-700]="isSelected(entry.type)"
          [class.text-primary-700]="isSelected(entry.type)"
          [class.dark:text-primary-300]="isSelected(entry.type)"
          [class.bg-steel-50]="!isSelected(entry.type)"
          [class.dark:bg-steel-800]="!isSelected(entry.type)"
          [class.border-steel-200]="!isSelected(entry.type)"
          [class.dark:border-steel-700]="!isSelected(entry.type)"
          [class.text-steel-600]="!isSelected(entry.type)"
          [class.dark:text-steel-300]="!isSelected(entry.type)"
        >
          {{ entry.label }}
          <span class="px-1.5 py-0.5 rounded-full text-[10px] bg-steel-200 dark:bg-steel-700 text-steel-700 dark:text-steel-200">{{ entry.count }}</span>
        </button>
      </div>

      <app-empty-state *ngIf="filteredResults().length === 0" title="No matching filters" description="Try clearing the selected filters."></app-empty-state>

      <div *ngIf="filteredResults().length > 0" class="space-y-2">
        <a *ngFor="let result of filteredResults()" [routerLink]="result.href" class="block app-panel p-4 hover:bg-steel-100 dark:hover:bg-steel-700/50 transition-colors">
          <div class="flex items-start justify-between gap-4">
            <div class="min-w-0 flex-1">
              <div class="flex items-center gap-2 mb-1 flex-wrap">
                <span class="text-[10px] uppercase tracking-wider font-semibold text-primary-600 dark:text-primary-400">{{ typeLabel(result.type) }}</span>
                <app-status-badge *ngIf="result.status" [status]="result.status"></app-status-badge>
                <span *ngIf="result.role" class="text-[10px] px-1.5 py-0.5 rounded bg-steel-100 dark:bg-steel-800 text-steel-600 dark:text-steel-300">{{ result.role }}</span>
                <span *ngIf="result.recordType" class="text-[10px] px-1.5 py-0.5 rounded bg-steel-100 dark:bg-steel-800 text-steel-600 dark:text-steel-300">{{ result.recordType }}</span>
              </div>
              <h3 class="text-sm font-semibold text-steel-900 dark:text-steel-100 truncate">{{ result.title || 'Untitled' }}</h3>
              <p class="text-xs text-steel-500 dark:text-steel-400 line-clamp-2 mt-1">{{ result.description }}</p>
            </div>
            <svg class="w-4 h-4 text-steel-400 dark:text-steel-500 flex-shrink-0 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
          </div>
        </a>
      </div>
    </ng-container>
  </ng-container>
</div>
