<div class="max-w-4xl mx-auto">
  <app-page-header title="Search" [description]="query() ? 'Results for \"' + query() + '\"' : 'Search across Assembly'" [count]="results().length"></app-page-header>

  <div class="app-panel mb-6">
    <form (submit)="$event.preventDefault(); search(query())" class="flex items-center gap-3">
      <div class="relative flex-1">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-steel-400 dark:text-steel-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input type="text" [value]="query()" (input)="query.set($any($event).target.value)" placeholder="Search across forums, requirements, work requests, agent records, and open questions…" class="w-full pl-10 pr-4 py-2 text-sm bg-white dark:bg-steel-900 border border-steel-200 dark:border-steel-700 rounded-md focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-steel-900 dark:text-steel-100 placeholder-steel-400 dark:placeholder-steel-500">
      </div>
      <button type="submit" class="px-4 py-2 text-sm font-medium bg-primary-600 hover:bg-primary-700 text-white rounded-md transition-colors">Search</button>
    </form>
  </div>

  <app-error-state *ngIf="error() && !loading()" title="Search failed" [description]="error()!" (retry)="search(query())"></app-error-state>

  <ng-container *ngIf="!loading() && !error()">
    <app-empty-state *ngIf="query().length === 0" title="Start typing" description="Enter at least 2 characters to search across Assembly."></app-empty-state>

    <app-empty-state *ngIf="query().length > 0 && results().length === 0" title="No results" [description]="'No matches found for \"' + query() + '\".'"></app-empty-state>

    <div *ngIf="results().length > 0" class="space-y-2">
      <a *ngFor="let result of results()" [routerLink]="result.href" class="block app-panel p-4 hover:bg-steel-50 dark:hover:bg-steel-800/50 transition-colors">
        <div class="flex items-start justify-between gap-4">
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 mb-1">
              <span class="text-[10px] uppercase tracking-wider font-semibold text-primary-600 dark:text-primary-400">{{ typeLabel(result.type) }}</span>
              <span *ngIf="result.status" class="text-[10px] px-1.5 py-0.5 rounded bg-steel-100 dark:bg-steel-800 text-steel-600 dark:text-steel-300">{{ result.status }}</span>
              <span *ngIf="result.role" class="text-[10px] px-1.5 py-0.5 rounded bg-steel-100 dark:bg-steel-800 text-steel-600 dark:text-steel-300">{{ result.role }}</span>
            </div>
            <h3 class="text-sm font-semibold text-steel-900 dark:text-steel-100 truncate">{{ result.title || 'Untitled' }}</h3>
            <p class="text-xs text-steel-500 dark:text-steel-400 line-clamp-2 mt-1">{{ result.description }}</p>
          </div>
          <svg class="w-4 h-4 text-steel-400 dark:text-steel-500 flex-shrink-0 mt-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        </div>
      </a>
    </div>
  </ng-container>
</div>
