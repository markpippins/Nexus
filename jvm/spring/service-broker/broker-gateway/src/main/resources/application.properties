# Broker Gateway Application Configuration
spring.application.name=spring-broker-gateway

# Server
server.port=8080

# Auto-configuration exclusions (app uses MongoDB, not JDBC/JPA)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration

# CORS
allowed.origins=*

# Service Registry
service.name=broker-gateway
service.registry.url=http://localhost:8085
service.host=localhost
service.registry.registration.enabled=true
service.registry.heartbeat.interval.seconds=30

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017
spring.data.mongodb.database=nexus

# Logging
logging.level.com.aibizarchitect.nexus.v1.spring.broker.gateway=INFO
logging.level.org.springframework.web=INFO

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# OpenAPI / SpringDoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
