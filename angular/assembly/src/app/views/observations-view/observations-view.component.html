<div class="max-w-6xl mx-auto">
  <app-page-header title="Observations" description="Captured observations from the system." [count]="total()"></app-page-header>

  <app-table-skeleton *ngIf="loading()" [cols]="5" [rows]="6"></app-table-skeleton>

  <app-error-state *ngIf="error() && !loading()" title="Failed to load observations" [description]="error()!" (retry)="retry()"></app-error-state>

  <ng-container *ngIf="!loading() && !error()">
    <app-empty-state *ngIf="items().length === 0" title="No observations" description="Observations will appear here once they are captured."></app-empty-state>

    <div *ngIf="items().length > 0" class="app-panel">
      <div class="overflow-x-auto">
      <table class="app-table">
      <thead>
        <tr>
          <th>Trigger</th>
          <th class="w-32">Artifact</th>
          <th class="w-24">Assessed</th>
          <th class="w-32">Created</th>
          <th class="w-28 text-right">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of items()">
          <td>
            <a [routerLink]="['/observations', item.id]" class="app-link">{{ item.triggerType }}</a>
          </td>
          <td class="text-xs text-gray-600 dark:text-gray-400">{{ item.sourceArtifactType || '—' }}</td>
          <td class="text-xs text-gray-600 dark:text-gray-400">{{ item.assessed ? 'Yes' : 'No' }}</td>
          <td class="text-xs text-gray-500 dark:text-gray-400">{{ formatDate(item.createdAt) }}</td>
          <td class="text-right"><app-raise-question objectType="observation" [objectId]="item.id" [objectTitle]="item.triggerType"></app-raise-question></td>
        </tr>
      </tbody>
      </table>
    </div>
    </div>
  </ng-container>
</div>
