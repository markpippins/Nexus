# Broker Gateway Application Configuration
spring.application.name=spring-broker-gateway

# Server
server.port=8081

# Auto-configuration exclusions
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.sql.init.SqlInitializationAutoConfiguration

# CORS
allowed.origins=*

# Service Registry
service.name=broker-gateway
service.registry.url=http://localhost:8085
service.host=localhost
service.registry.registration.enabled=true
service.registry.heartbeat.interval.seconds=30

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017
spring.data.mongodb.database=nexus

# Logging
logging.level.com.aibizarchitect.nexus.v1.spring.broker.gateway=INFO
logging.level.com.aibizarchitect.nexus.v1.spring.broker=INFO
logging.level.com.aibizarchitect.nexus.v1.spring.fs=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.context=INFO

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# OpenAPI / SpringDoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# PostgreSQL Database (schema: broker_gateway — for user-access-service JPA)
spring.datasource.url=jdbc:postgresql://localhost:5433/nexus?currentSchema=broker_gateway
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=pguser
spring.datasource.password=pgpass
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# File Service (restfs)
restfs.api.url=http://localhost:4040/fs
