<div class="max-w-5xl mx-auto">
  <app-page-header title="Feed" description="Latest posts across Assembly." [count]="posts().length"></app-page-header>

  <app-create-post (posted)="retry()"></app-create-post>

  <div *ngIf="loading()" class="space-y-3">
    <div *ngFor="let _ of [1,2,3]" class="app-panel p-4">
      <div class="flex items-start gap-3">
        <app-skeleton width="2rem" height="2rem" [circle]="true"></app-skeleton>
        <div class="flex-1 space-y-2">
          <app-skeleton width="30%" height="0.75rem"></app-skeleton>
          <app-skeleton width="80%" height="0.875rem"></app-skeleton>
          <app-skeleton width="60%" height="0.875rem"></app-skeleton>
        </div>
      </div>
    </div>
  </div>

  <app-error-state *ngIf="error() && !loading()" title="Failed to load feed" [description]="error()!" (retry)="retry()"></app-error-state>

  <ng-container *ngIf="!loading() && !error()">
    <app-empty-state *ngIf="posts().length === 0" title="No posts" description="Posts will appear here once they are created."></app-empty-state>

    <div *ngIf="posts().length > 0">
      <!-- Sort toolbar -->
      <div class="flex items-center gap-2 mb-3 px-1">
        <span class="text-[11px] font-medium text-steel-500 dark:text-steel-400 uppercase tracking-wider">Sort by</span>
        <button (click)="toggleSort('title')"
          class="inline-flex items-center gap-1 px-2 py-1 text-[11px] font-medium rounded border transition-colors"
          [class.bg-primary-50]="sortField() === 'title'"
          [class.text-primary-700]="sortField() === 'title'"
          [class.border-primary-200]="sortField() === 'title'"
          [class.text-steel-500]="sortField() !== 'title'"
          [class.border-steel-200]="sortField() !== 'title'"
          [class.hover:bg-steel-50]="sortField() !== 'title'">
          Title
          <span *ngIf="sortField() === 'title'" class="text-[10px]">{{ sortDir() === 'asc' ? '▲' : '▼' }}</span>
        </button>
        <button (click)="toggleSort('createdAt')"
          class="inline-flex items-center gap-1 px-2 py-1 text-[11px] font-medium rounded border transition-colors"
          [class.bg-primary-50]="sortField() === 'createdAt'"
          [class.text-primary-700]="sortField() === 'createdAt'"
          [class.border-primary-200]="sortField() === 'createdAt'"
          [class.text-steel-500]="sortField() !== 'createdAt'"
          [class.border-steel-200]="sortField() !== 'createdAt'"
          [class.hover:bg-steel-50]="sortField() !== 'createdAt'">
          Date
          <span *ngIf="sortField() === 'createdAt'" class="text-[10px]">{{ sortDir() === 'asc' ? '▲' : '▼' }}</span>
        </button>
        <button (click)="toggleSort('comments')"
          class="inline-flex items-center gap-1 px-2 py-1 text-[11px] font-medium rounded border transition-colors"
          [class.bg-primary-50]="sortField() === 'comments'"
          [class.text-primary-700]="sortField() === 'comments'"
          [class.border-primary-200]="sortField() === 'comments'"
          [class.text-steel-500]="sortField() !== 'comments'"
          [class.border-steel-200]="sortField() !== 'comments'"
          [class.hover:bg-steel-50]="sortField() !== 'comments'">
          Comments
          <span *ngIf="sortField() === 'comments'" class="text-[10px]">{{ sortDir() === 'asc' ? '▲' : '▼' }}</span>
        </button>
        <button *ngIf="sortField()" (click)="toggleSort('')" class="ml-auto text-[11px] text-steel-400 hover:text-steel-600 dark:hover:text-steel-300 transition-colors">
          Clear sort
        </button>
      </div>

      <div class="space-y-3">
      <div
        *ngFor="let post of sortedPosts()"
        [routerLink]="post.forum ? ['/forums', post.forum.slug, post.id] : null"
        class="app-panel p-4 hover:shadow-soft hover:cursor-pointer transition-all duration-150"
      >
        <div class="flex items-start gap-3">
          <app-avatar [name]="post.author.name" [size]="40"></app-avatar>
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-sm font-semibold text-gray-900 dark:text-gray-100">{{ post.author.name }}</span>
              <app-time-ago [date]="post.createdAt" class="text-xs text-gray-500 dark:text-gray-400"></app-time-ago>
              <a *ngIf="post.forum" [routerLink]="['/forums', post.forum.slug]" class="text-xs px-1.5 py-0.5 bg-steel-100 dark:bg-steel-800 text-steel-600 dark:text-steel-400 rounded-full hover:bg-primary-50 hover:text-primary-700 transition-colors" (click)="$event.stopPropagation()">{{ post.forum!.name }}</a>
            </div>
            <h3 *ngIf="post.title" class="text-sm font-medium text-gray-900 dark:text-gray-100 mt-1">{{ post.title }}</h3>
            <div class="mt-1 line-clamp-3">
              <app-markdown-renderer [content]="post.content"></app-markdown-renderer>
            </div>
            <div class="flex items-center gap-4 mt-3 text-xs text-steel-500 dark:text-steel-400">
              <a [routerLink]="post.forum ? ['/forums', post.forum.slug, post.id] : ['/forums']" class="flex items-center gap-1 hover:text-primary-700 transition-colors" (click)="$event.stopPropagation()">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h8M8 14h8M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                {{ post.comments }} comments
              </a>
              <button class="flex items-center gap-1 hover:text-primary-700 transition-colors" (click)="likePost(post.id); $event.stopPropagation()">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
                Like
              </button>
              <button class="flex items-center gap-1 hover:text-primary-700 transition-colors" (click)="sharePost(post); $event.stopPropagation()">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12s-.113-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.367 2.684 3 3 0 00-5.367-2.684z"/></svg>
                Share
              </button>
              <span (click)="$event.stopPropagation()"><app-raise-question objectType="post" [objectId]="post.id" [objectTitle]="post.title || 'Feed post'"></app-raise-question></span>
              <button
                class="flex items-center gap-1 hover:text-red-500 transition-colors"
                [class.text-steel-300]="deleting() === post.id"
                [class.text-steel-400]="deleting() !== post.id"
                [disabled]="deleting() === post.id"
                (click)="deletePost(post.id); $event.stopPropagation()"
                title="Delete post"
              >
                <svg *ngIf="deleting() !== post.id" class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
                <svg *ngIf="deleting() === post.id" class="w-3.5 h-3.5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 2v4m0 12v4m-8.485-8.485h4m8.97 0h4M5.636 5.636l2.828 2.828m7.072 7.072l2.828 2.828M5.636 18.364l2.828-2.828m7.072-7.072l2.828-2.828"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
      </div>
    </div>
  </ng-container>
</div>
