# SonarQube analysis configuration for nexus (vanadium CI gate)
# Project: nexus (single project key, monorepo scope)
sonar.projectKey=nexus
sonar.projectName=nexus

# Source scope: TS services + python. JVM excluded (no compiled classes in-repo).
# file-system-server excluded — its root/ contains a recursive workspace copy
# with nested tsconfigs that confuse the TypeScript sensor.
sonar.sources=python,typescript/address-tts-mcp,typescript/assembly-mcp,typescript/assembly-srv,typescript/cascade-srv,typescript/conduit-mcp,typescript/conduit-srv,typescript/draft-srv,typescript/execution-srv,typescript/harness-srv,typescript/kernel-srv,typescript/knowledge-mcp,typescript/knowledge-srv,typescript/mcp-bridge,typescript/mcp-registry-seeder,typescript/mcp-types,typescript/nebula-mcp,typescript/nebula-srv,typescript/peb-mcp,typescript/peb-srv,typescript/pty-srv,typescript/role-memory-srv,typescript/semantics-mcp,typescript/semantics-srv,typescript/service-broker-mcp,typescript/shrapnel,typescript/slash-command-mcp,typescript/tackle-cli,typescript/tackle-mcp,typescript/tackle-prompt-bridge,typescript/tackle-prompt-sync-srv,typescript/tackle-srv,typescript/terrain-mcp,typescript/tools-aggregator,typescript/ui-event-bus,typescript/ui-tools-mcp,typescript/ui-tools,typescript/vision-mcp,typescript/voyager-srv,typescript/wind-srv,typescript/google

# Exclude generated/dependency/build output + infra dirs.
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/target/**,\
  **/*.min.js,\
  **/*.map,\
  **/generated/**,\
  legacy/**,\
  sandbox/**,\
  **/file-system-server/**,\
  **/secure-file-system-server/root/**

# Restrict TypeScript tsconfig discovery to our actual source dirs only.
# Without this, the TS sensor walks the entire project tree finding nested
# tsconfig.json files inside file-system-server/root/ (recursive workspace copy).
sonar.javascript.tsconfigPaths=\
  typescript/address-tts-mcp/tsconfig.json,\
  typescript/assembly-mcp/tsconfig.json,\
  typescript/assembly-srv/tsconfig.json,\
  typescript/cascade-srv/tsconfig.json,\
  typescript/conduit-mcp/tsconfig.json,\
  typescript/conduit-srv/tsconfig.json,\
  typescript/draft-srv/tsconfig.json,\
  typescript/execution-srv/tsconfig.json,\
  typescript/harness-srv/tsconfig.json,\
  typescript/kernel-srv/tsconfig.json,\
  typescript/knowledge-mcp/tsconfig.json,\
  typescript/knowledge-srv/tsconfig.json,\
  typescript/mcp-bridge/tsconfig.json,\
  typescript/mcp-registry-seeder/tsconfig.json,\
  typescript/mcp-types/tsconfig.json,\
  typescript/nebula-mcp/tsconfig.json,\
  typescript/nebula-srv/tsconfig.json,\
  typescript/peb-mcp/tsconfig.json,\
  typescript/peb-srv/tsconfig.json,\
  typescript/pty-srv/tsconfig.json,\
  typescript/role-memory-srv/tsconfig.json,\
  typescript/semantics-mcp/tsconfig.json,\
