<div class="dashboard">
  <h2>📋 Changes</h2>
  <div class="chips">
    <button class="chip" *ngFor="let c of [{k:'all',l:'All'},{k:'committed',l:'Committed'},{k:'flagged',l:'Flagged'},{k:'reviewed',l:'Reviewed'}]"
      [ngClass]="{ active: activeCat() === c.k }" (click)="setCat(c.k)">{{c.l}}</button>
  </div>
  <app-loading-spinner *ngIf="loading()" />
  <app-error-banner *ngIf="error() as e" [message]="e" retryLabel="Retry" (retry)="load()" />
  <ng-container *ngIf="!loading() && !error()">
    <div class="results">
      <div class="row" *ngFor="let r of results()" (click)="expanded()===r.path?expanded.set(null):expanded.set(r.path)">
        <div class="row-main">
          <span class="icon">{{r.allAcceptancePassing?'✅':'⚠️'}}</span>
          <span class="name">{{r.title}}</span>
          <span class="age">{{getAge(r.mtime)}}</span>
        </div>
        <div class="detail" *ngIf="expanded()===r.path">
          <div class="d-label">Agent</div><div class="d-value">{{r.agent}}</div>
          <div class="d-label">Plans</div><div class="d-value">{{r.plansProcessed}} plans</div>
          <div class="d-label" *ngIf="(r.planRefs||[]).length">Plan References</div>
          <div class="d-value">{{planRefsStr(r)}}</div>
          <div class="d-label" *ngIf="r.totalTests!=null">Tests</div>
          <div class="d-value" *ngIf="r.totalTests!=null">{{r.testsPassing}}/{{r.totalTests}}</div>
          <div class="d-label">Files</div><div class="d-value">{{r.newFiles||0}} NEW, {{r.modifyFiles||0}} MODIFY</div>
        </div>
      </div>
      <app-empty-state *ngIf="results().length===0" icon="📋" title="No change reports" description="No change reports match the current filter." />
    </div>
  </ng-container>
</div>
