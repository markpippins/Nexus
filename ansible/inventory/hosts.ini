# Vanadium failover-tier inventory.
# Use the mDNS hostname: direct-IP connects stall during banner exchange
# when the Pi is busy (observed 2026-08-24 mid-reboot); the hostname path
# has been reliable. Resolved via getent: vanadium.attlocal.net -> 192.168.1.209
[vanadium]
vanadium ansible_host=vanadium.attlocal.net ansible_user=codex

[vanadium:vars]
ansible_python_interpreter=/usr/bin/python3
