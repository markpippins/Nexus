<div class="flex items-center justify-between border-t border-gray-200 dark:border-gray-700 px-4 py-3 sm:px-6">
  <!-- Mobile: compact view -->
  <div class="flex flex-1 justify-between sm:hidden">
    <button
      (click)="goToPage(currentPage - 1)"
      [disabled]="currentPage <= 1"
      class="relative inline-flex items-center rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-steel-800 px-4 py-2 text-xs font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-steel-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
    >
      Previous
    </button>
    <button
      (click)="goToPage(currentPage + 1)"
      [disabled]="currentPage >= totalPages"
      class="relative ml-3 inline-flex items-center rounded-md border border-gray-300 dark:border-gray-600 bg-white dark:bg-steel-800 px-4 py-2 text-xs font-medium text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-steel-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors"
    >
      Next
    </button>
  </div>

  <!-- Desktop: full pagination -->
  <div class="hidden sm:flex sm:flex-1 sm:items-center sm:justify-between">
    <div>
      <p class="text-xs text-gray-500 dark:text-gray-400">
        Showing <span class="font-medium">{{ startItem }}</span>
        to <span class="font-medium">{{ endItem }}</span>
        of <span class="font-medium">{{ totalItems }}</span> results
      </p>
    </div>
    <div>
      <nav class="isolate inline-flex -space-x-px rounded-md shadow-xs" aria-label="Pagination">
        <!-- Previous -->
        <button
          (click)="goToPage(currentPage - 1)"
          [disabled]="currentPage <= 1"
          class="relative inline-flex items-center rounded-l-md px-2 py-2 text-gray-400 dark:text-gray-500 ring-1 ring-inset ring-gray-300 dark:ring-gray-600 hover:bg-gray-50 dark:hover:bg-steel-700 focus:z-20 focus:outline-offset-0 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
        >
          <span class="sr-only">Previous</span>
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
          </svg>
        </button>

        <!-- Pages -->
        <ng-container *ngFor="let page of pages">
          <button
            *ngIf="page !== -1"
            (click)="goToPage(page)"
            [class.bg-primary-600]="page === currentPage"
            [class.text-white]="page === currentPage"
            [class.hover:bg-primary-500]="page === currentPage"
            [class.text-gray-900]="page !== currentPage"
            [class.ring-1]="page !== currentPage"
            [class.ring-inset]="page !== currentPage"
            [class.ring-gray-300]="page !== currentPage"
            [class.dark:ring-gray-600]="page !== currentPage"
            [class.hover:bg-gray-50]="page !== currentPage"
            [class.dark:hover:bg-steel-700]="page !== currentPage"
            class="relative inline-flex items-center px-3.5 py-2 text-xs font-semibold focus:z-20 focus:outline-offset-0 transition-colors dark:text-gray-300"
          >
            {{ page }}
          </button>
          <span
            *ngIf="page === -1"
            class="relative inline-flex items-center px-3.5 py-2 text-xs font-semibold text-gray-500 dark:text-gray-400 ring-1 ring-inset ring-gray-300 dark:ring-gray-600 focus:outline-offset-0"
          >
            &hellip;
          </span>
        </ng-container>

        <!-- Next -->
        <button
          (click)="goToPage(currentPage + 1)"
          [disabled]="currentPage >= totalPages"
          class="relative inline-flex items-center rounded-r-md px-2 py-2 text-gray-400 dark:text-gray-500 ring-1 ring-inset ring-gray-300 dark:ring-gray-600 hover:bg-gray-50 dark:hover:bg-steel-700 focus:z-20 focus:outline-offset-0 disabled:opacity-40 disabled:cursor-not-allowed transition-colors"
        >
          <span class="sr-only">Next</span>
          <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
          </svg>
        </button>
      </nav>
    </div>
  </div>
</div>
