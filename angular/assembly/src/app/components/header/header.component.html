<header class="h-12 flex items-center justify-between px-3 sm:px-4 bg-white dark:bg-steel-800 border-b border-steel-200 dark:border-steel-700 flex-shrink-0 shadow-sm transition-colors">
  <div class="flex items-center gap-2 sm:gap-3 min-w-0">
    <button (click)="toggleMobileSidebar.emit()" class="lg:hidden p-1.5 rounded hover:bg-steel-100 dark:hover:bg-steel-700 text-steel-500 dark:text-steel-400 hover:text-steel-700 dark:hover:text-steel-200 transition-colors" aria-label="Open menu">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button (click)="toggleSidebar.emit()" class="hidden lg:flex p-1.5 rounded hover:bg-steel-100 dark:hover:bg-steel-700 text-steel-500 dark:text-steel-400 hover:text-steel-700 dark:hover:text-steel-200 transition-colors" aria-label="Collapse sidebar">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <button (click)="goHome()" class="font-semibold text-sm text-primary-600 dark:text-primary-400 hover:text-primary-700 dark:hover:text-primary-300 transition-colors">Assembly</button>
    <span class="text-steel-300 dark:text-steel-600 hidden sm:inline">/</span>
    <span class="text-sm font-medium text-steel-700 dark:text-steel-200 truncate">{{ label }}</span>
  </div>
  <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0">
    <button (click)="openSearch()" class="hidden md:flex items-center bg-steel-50 dark:bg-steel-900 rounded-md px-2 h-8 text-xs text-steel-500 dark:text-steel-400 border border-steel-200 dark:border-steel-700 hover:border-steel-300 dark:hover:border-steel-600 transition-colors">
      <svg class="w-3.5 h-3.5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      Search Assembly…
      <span class="ml-2 text-[10px] text-steel-400 dark:text-steel-500 border border-steel-300 dark:border-steel-600 rounded px-1">⌘K</span>
    </button>
    <button (click)="toggleTheme.emit()" class="p-1.5 rounded hover:bg-steel-100 dark:hover:bg-steel-700 text-steel-500 dark:text-steel-400 hover:text-steel-700 dark:hover:text-steel-200 transition-colors" [attr.aria-label]="'Switch to ' + (currentTheme === 'light' ? 'steel' : currentTheme === 'steel' ? 'dark' : 'light') + ' theme'">
      @switch (currentTheme) {
        @case ('light') {
          <!-- Light → crescent moon (goes to steel) -->
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
        }
        @case ('steel') {
          <!-- Steel → moon + star (goes to dark) -->
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
            <circle cx="19" cy="6" r="1.5" fill="currentColor" stroke="none"/>
          </svg>
        }
        @case ('dark') {
          <!-- Dark → sun (goes to light) -->
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
        }
      }
    </button>
    <div class="w-7 h-7 rounded-full bg-primary-100 dark:bg-primary-900/40 text-primary-700 dark:text-primary-300 flex items-center justify-center text-xs font-semibold ring-2 ring-white dark:ring-steel-700 shadow-sm">EN</div>
  </div>
</header>

@if (searchOpen) {
  <div class="fixed inset-0 z-50 flex items-start justify-center pt-16 sm:pt-24 px-4 bg-black/40 backdrop-blur-sm" (click)="closeSearch()">
    <div class="w-full max-w-2xl bg-white dark:bg-steel-800 rounded-lg shadow-2xl border border-steel-200 dark:border-steel-700 overflow-hidden" (click)="$event.stopPropagation()">
      <form (submit)="onSearchSubmit($event)" class="flex items-center px-4 py-3 border-b border-steel-200 dark:border-steel-700">
        <svg class="w-5 h-5 text-steel-400 dark:text-steel-500 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <input #searchInput type="text" [(ngModel)]="searchQuery" name="q" placeholder="Search Assembly…" class="flex-1 bg-transparent text-sm text-steel-900 dark:text-steel-100 placeholder-steel-400 dark:placeholder-steel-500 outline-none">
        <button type="button" (click)="closeSearch()" class="ml-2 text-xs text-steel-500 dark:text-steel-400 hover:text-steel-700 dark:hover:text-steel-200">Esc</button>
      </form>
      <div class="px-4 py-3 text-xs text-steel-500 dark:text-steel-400">
        Press <strong>Enter</strong> to search
      </div>
    </div>
  </div>
}
