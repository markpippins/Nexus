# Ansible defaults tuned for the Pi 5 target: SSH banner/KEX can take a
# while when the host is mid container-start-storm after a reboot.
[defaults]
inventory = inventory/hosts.ini
remote_user = codex
host_key_checking = True
timeout = 60
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=120s -o ConnectTimeout=45
pipelining = True
