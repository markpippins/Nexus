<div class="max-w-6xl mx-auto">
  <app-page-header title="Conversations" description="Captured conversation snapshots." [count]="total()"></app-page-header>

  <app-table-skeleton *ngIf="loading()" [cols]="4" [rows]="6"></app-table-skeleton>

  <app-error-state *ngIf="error() && !loading()" title="Failed to load conversations" [description]="error()!" (retry)="retry()"></app-error-state>

  <ng-container *ngIf="!loading() && !error()">
    <app-empty-state *ngIf="items().length === 0" title="No conversations" description="Conversation snapshots will appear here once they are captured."></app-empty-state>

    <div *ngIf="items().length > 0" class="app-panel">
      <div class="overflow-x-auto">
      <table class="app-table">
      <thead>
        <tr>
          <th>Filename</th>
          <th class="w-24">Mode</th>
          <th class="w-32">Created</th>
          <th class="w-28 text-right">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of items()">
          <td>
            <a [routerLink]="['/conversations', item.id]" class="app-link">{{ item.sourceFilename || 'Untitled' }}</a>
            <div class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">{{ item.conversationId }}</div>
          </td>
          <td class="text-xs text-gray-600 dark:text-gray-400">{{ item.captureMode || '—' }}</td>
          <td class="text-xs text-gray-500 dark:text-gray-400">{{ formatDate(item.createdAt) }}</td>
          <td class="text-right"><app-raise-question objectType="conversation" [objectId]="item.id" [objectTitle]="item.sourceFilename || 'Untitled'"></app-raise-question></td>
        </tr>
      </tbody>
      </table>
    </div>
    </div>
  </ng-container>
</div>
