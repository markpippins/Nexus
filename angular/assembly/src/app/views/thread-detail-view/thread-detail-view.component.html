<div class="max-w-4xl mx-auto">
  <div *ngIf="loading()" class="space-y-3">
    <div class="app-panel p-4 space-y-3">
      <app-skeleton width="40%" height="1rem"></app-skeleton>
      <app-skeleton width="20%" height="0.75rem"></app-skeleton>
      <app-skeleton width="100%" height="4rem"></app-skeleton>
    </div>
    <div *ngFor="let _ of [1,2]" class="app-panel p-3 space-y-2">
      <app-skeleton width="30%" height="0.75rem"></app-skeleton>
      <app-skeleton width="90%" height="0.875rem"></app-skeleton>
    </div>
  </div>

  <app-error-state *ngIf="error() && !loading()" title="Failed to load thread" [description]="error()!" (retry)="retry()"></app-error-state>

  <ng-container *ngIf="!loading() && !error() && thread()">
    <div class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400 mb-3">
      <a [routerLink]="['/forums']" class="hover:text-primary-700 transition-colors">Forums</a>
      <span>/</span>
      <a [routerLink]="['/forums', thread()!.forum.slug]" class="hover:text-primary-700 transition-colors">{{ thread()!.forum.name }}</a>
    </div>
    <div class="app-panel p-4 mb-4">
      <h1 class="text-lg font-bold text-gray-900 dark:text-gray-100">{{ thread()!.title }}</h1>
      <div class="flex items-center gap-2 mt-3">
        <app-avatar [name]="thread()!.author.name" [size]="32"></app-avatar>
        <div class="text-xs text-gray-500 dark:text-gray-400">
          <span class="font-medium text-gray-700 dark:text-gray-300">{{ thread()!.author.name }}</span>
          <app-time-ago [date]="thread()!.createdAt"></app-time-ago>
        </div>
      </div>
      <div class="mt-4">
        <app-markdown-renderer [content]="thread()!.body"></app-markdown-renderer>
      </div>
      <div class="mt-4">
        <app-raise-question objectType="thread" [objectId]="thread()!.id" [objectTitle]="thread()!.title"></app-raise-question>
      </div>
    </div>

    <h2 class="text-sm font-semibold text-gray-900 dark:text-gray-100 mb-2">Comments ({{ comments().length }})</h2>
    <app-empty-state *ngIf="comments().length === 0" title="No comments" description="Comments will appear here once they are added."></app-empty-state>
    <div class="space-y-3">
      <div *ngFor="let comment of comments()" class="app-panel p-3">
        <div class="flex items-center gap-2">
          <app-avatar [name]="comment.author.name" [size]="28"></app-avatar>
          <div class="text-xs text-gray-500 dark:text-gray-400">
            <span class="font-medium text-gray-700 dark:text-gray-300">{{ comment.author.name }}</span>
            <app-time-ago [date]="comment.createdAt"></app-time-ago>
          </div>
        </div>
        <div class="mt-1 ml-9">
          <app-markdown-renderer [content]="comment.body"></app-markdown-renderer>
        </div>
      </div>
    </div>

    <div class="app-panel p-3 mt-4">
      <h3 class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase mb-2">Add a comment</h3>
      <textarea [(ngModel)]="replyBody" placeholder="Write a reply..." rows="2" class="w-full resize-none rounded border border-gray-200 dark:border-gray-700 dark:bg-gray-900 dark:text-gray-100 p-2 text-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 outline-none"></textarea>
      <div class="flex justify-end mt-2">
        <button (click)="submitReply()" [disabled]="!replyBody.trim()" class="app-btn-primary disabled:opacity-50 disabled:cursor-not-allowed">Reply</button>
      </div>
    </div>
  </ng-container>
</div>
