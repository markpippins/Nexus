<div class="flex h-screen antialiased text-[rgb(var(--color-text-base))] bg-[rgb(var(--color-background))]">
  <!-- File Tree Panel -->
  <div [style.width.px]="fileTreeWidth()" class="flex-shrink-0 relative">
    <app-file-tree
        [nodes]="fileTreeNodes()"
        [loading]="fileTreeLoading()"
        [selectedPath]="activeFilePath()"
        (fileSelected)="onFileTreeSelect($event)"
        (refresh)="onFileTreeRefresh()"
        (loadChildren)="loadDirectoryChildren($event)"
      ></app-file-tree>
    <!-- Resize handle -->
    <div
      (mousedown)="startTreeResize($event)"
      class="absolute top-0 right-0 w-1.5 h-full cursor-col-resize group z-10"
      [class.bg-[rgb(var(--color-accent-ring))]]="isResizingTree()"
    >
      <div class="absolute inset-y-0 right-0 w-px bg-[rgb(var(--color-border-muted))] group-hover:bg-[rgb(var(--color-accent-ring))] transition-colors"></div>
    </div>
  </div>

  <!-- Main Content Area -->
  <div class="flex-1 flex flex-col min-w-0">
    <!-- Address Bar -->
    <div class="h-10 px-4 border-b border-[rgb(var(--color-border-base))] flex items-center space-x-2 flex-shrink-0 bg-[rgb(var(--color-surface-muted))]">
      <button
        (click)="goUp()"
        title="Up (Backspace)"
        class="p-1.5 rounded-md hover:bg-[rgb(var(--color-surface-hover))] disabled:opacity-40 disabled:cursor-not-allowed"
        [disabled]="addressSegments().length === 0"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[rgb(var(--color-text-muted))]" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clip-rule="evenodd" />
        </svg>
      </button>

      <!-- Breadcrumb path -->
      <div class="flex-grow flex items-center bg-[rgb(var(--color-background))] rounded-md border border-[rgb(var(--color-border-muted))] px-2 py-1 text-sm h-7">
        <!-- Root -->
        <button
          (click)="navigateToSegment(-1)"
          class="text-[rgb(var(--color-accent-text))] hover:underline cursor-pointer text-xs"
        >
          /
        </button>
        @for (segment of addressSegments(); track segment; let i = $index) {
          <span class="mx-0.5 text-[rgb(var(--color-text-subtle))]">/</span>
          <button
            (click)="navigateToSegment(i)"
            class="text-[rgb(var(--color-accent-text))] hover:underline cursor-pointer text-xs truncate max-w-[150px]"
          >
            {{ segment }}
          </button>
        }
      </div>

      <!-- Refresh -->
      <button
        (click)="onFileTreeRefresh()"
        title="Refresh"
        class="p-1.5 rounded-md hover:bg-[rgb(var(--color-surface-hover))]"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[rgb(var(--color-text-muted))]" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4 2a1 1 0 011 1v2.101a7.002 7.002 0 0111.601 2.566 1 1 0 11-1.885.666A5.002 5.002 0 005.999 7H9a1 1 0 010 2H4a1 1 0 01-1-1V3a1 1 0 011-1zm10.899 12.101A7.002 7.002 0 012.399 8.567a1 1 0 011.885-.666A5.002 5.002 0 0014.001 13H11a1 1 0 110-2h5a1 1 0 011 1v5a1 1 0 11-2 0v-2.101z" clip-rule="evenodd" />
        </svg>
      </button>

      <!-- Separator -->
      <div class="w-px h-5 bg-[rgb(var(--color-border-muted))]"></div>

      <!-- New File -->
      <button
        (click)="createNewFile()"
        title="New File"
        class="p-1.5 rounded-md hover:bg-[rgb(var(--color-surface-hover))]"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[rgb(var(--color-text-muted))]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m3.75 9v6m3-3H9m1.5-12H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
        </svg>
      </button>

      <!-- New Folder -->
      <button
        (click)="createNewFolder()"
        title="New Folder"
        class="p-1.5 rounded-md hover:bg-[rgb(var(--color-surface-hover))]"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[rgb(var(--color-text-muted))]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 10.5v6m3-3H9m4.06-7.19l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z" />
        </svg>
      </button>

      <!-- Rename -->
      <button
        (click)="renameSelected()"
        title="Rename (F2)"
        class="p-1.5 rounded-md hover:bg-[rgb(var(--color-surface-hover))]"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[rgb(var(--color-text-muted))]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10" />
        </svg>
      </button>

      <!-- Delete -->
      <button
        (click)="deleteSelected()"
        title="Delete (Del)"
        class="p-1.5 rounded-md hover:bg-[rgb(var(--color-danger-bg-hover))] text-[rgb(var(--color-danger-text))]"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
        </svg>
      </button>

      <div class="w-px h-5 bg-[rgb(var(--color-border-muted))]"></div>

      <!-- Save button -->
      <button
        (click)="saveCurrentFile()"
        title="Save (Ctrl+S)"
        class="p-1.5 rounded-md hover:bg-[rgb(var(--color-surface-hover))]"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-[rgb(var(--color-text-muted))]" viewBox="0 0 20 20" fill="currentColor">
          <path d="M7.707 10.293a1 1 0 10-1.414 1.414l3 3a1 1 0 001.414 0l3-3a1 1 0 00-1.414-1.414L11 11.586V6h5a2 2 0 012 2v7a2 2 0 01-2 2H4a2 2 0 01-2-2V8a2 2 0 012-2h5v5.586l-1.293-1.293z" />
        </svg>
      </button>
    </div>

    <!-- Editor -->
    <div class="flex-1 overflow-hidden">
      <app-monaco-editor
        [openFiles]="openFiles()"
        [activeFile]="activeFilePath()"
        (tabSelected)="selectTab($event)"
        (tabClosed)="closeFile($event)"
        (contentChanged)="onContentChanged($event)"
      ></app-monaco-editor>
    </div>
  </div>
</div>
