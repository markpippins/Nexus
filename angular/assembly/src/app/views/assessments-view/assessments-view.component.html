<div class="max-w-6xl mx-auto">
  <app-page-header title="Assessments" description="Assessment outcomes and confidence scores." [count]="total()"></app-page-header>

  <app-table-skeleton *ngIf="loading()" [cols]="4" [rows]="6"></app-table-skeleton>

  <app-error-state *ngIf="error() && !loading()" title="Failed to load assessments" [description]="error()!" (retry)="retry()"></app-error-state>

  <ng-container *ngIf="!loading() && !error()">
    <app-empty-state *ngIf="items().length === 0" title="No assessments" description="Assessments will appear here once they are created."></app-empty-state>

    <div *ngIf="items().length > 0" class="app-panel">
      <div class="overflow-x-auto">
      <table class="app-table">
      <thead>
        <tr>
          <th>Outcome</th>
          <th class="w-28">Confidence</th>
          <th class="w-32">Created</th>
          <th class="w-28 text-right">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of items()">
          <td>
            <a [routerLink]="['/assessments', item.id]" class="app-link">{{ item.outcome }}</a>
            <div class="text-xs text-gray-500 dark:text-gray-400 line-clamp-1 mt-0.5">{{ item.analysisDetail || 'No detail' }}</div>
          </td>
          <td class="text-sm text-gray-600 dark:text-gray-400">{{ item.confidence != null ? (item.confidence * 100).toFixed(0) + '%' : '—' }}</td>
          <td class="text-xs text-gray-500 dark:text-gray-400">{{ formatDate(item.createdAt) }}</td>
          <td class="text-right"><app-raise-question objectType="assessment" [objectId]="item.id" [objectTitle]="item.outcome"></app-raise-question></td>
        </tr>
      </tbody>
      </table>
    </div>
    </div>
  </ng-container>
</div>
