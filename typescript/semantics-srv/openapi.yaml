openapi: "3.0.3"
info:
  title: semantics-srv REST API
  version: "1.0.0"
  description: "REST API over the semantics.* Postgres schema — the type-level semantic topology legend of the Nexus platform. Append-only, expire-not-delete: writes go through stored procedures, PATCH supersedes (new id + superseded_id), DELETE soft-expires. This document is GENERATED from src/tables.ts — re-run `npm run openapi:gen` after table changes."
servers:
  - url: "http://localhost:3160"
    description:
      local semantics-srv
tags:
  - name: system
    description:
      Health + schema introspection
  - name: owning_subsystem
    description:
      owning subsystem (fleet)
  - name: concept
    description:
      concept (class)
  - name: representation
    description:
      representation (physical form of a concept)
  - name: representation_relationship
    description:
      representation relationship (fidelity/lineage between forms)
  - name: consumer_operation
    description:
      consumer operation (who touches a representation and how)
  - name: identity_strategy
    description:
      identity strategy (what identity means for a concept)
  - name: representation_identity
    description:
      representation identity (how a form expresses its concept's identity)
  - name: snapshot
    description:
      snapshot (per-baseline judgment record)
  - name: snapshot_observation
    description:
      snapshot observation (per-baseline judgment on a representation)
  - name: concept_relationship
    description:
      concept relationship (legal pipeline shape between classes)
  - name: relationship_type
    description:
      relationship type (vocabulary of legal edge types)
  - name: drift_finding
    description:
      drift lifecycle
paths:
  /api/owning_subsystem:
    get:
      summary: List active rows in semantics.owning_subsystem (owning subsystem (fleet))
      operationId: listOwning_subsystem
      tags:
        - owning_subsystem
      parameters:
        - name: limit
          in:
            query
          schema:
            type: integer
            default: 100
            maximum: 500
          description:
            Max rows (clamped to 500)
        - name: offset
          in:
            query
          schema:
            type: integer
            default: 0
            minimum: 0
          description:
            Row offset
        - name: includeExpired
          in:
            query
          schema:
            type: boolean
            default: false
          description:
            Also return rows with expired_at set
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/owning_subsystemList"
        500:
          description: list_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: Add a row to semantics.owning_subsystem via add_ proc (owning subsystem (fleet))
      operationId: addOwning_subsystem
      tags:
        - owning_subsystem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/owning_subsystemWrite"
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/owning_subsystemRow"
        400:
          description: add_failed / duplicate_active_key / FK violation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/owning_subsystem/{id}:
    get:
      summary: Get a single row from semantics.owning_subsystem by id
      operationId: getOwning_subsystem
      tags:
        - owning_subsystem
      parameters:
        - name: id
          in:
            path
          required:
            true
          description:
            "Row id (uuid, or smallint for owning_subsystem)"
          schema:
            type: integer
            format: int32
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/owning_subsystemRow"
        404:
          description: not_found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        500:
          description: get_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      summary: "Append-only replace on semantics.owning_subsystem — expires the row with the given id and inserts a NEW version with a NEW id; response includes superseded_id"
      operationId: updateOwning_subsystem
      tags:
        - owning_subsystem
      parameters:
        - name: id
          in:
            path
          required:
            true
          description:
            "Row id (uuid, or smallint for owning_subsystem)"
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/owning_subsystemUpdate"
      responses:
        200:
          description: "OK — new row with superseded_id"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/owning_subsystemRow"
                  - type: object
                    required:
                      - superseded_id
                    properties:
                      superseded_id:
                        type: string
                        description: id of the expired row
        400:
          description: duplicate_active_key / update_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: "not_found — no active row"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      summary: "Soft-delete (expire) a row in semantics.owning_subsystem — expire-not-delete, idempotent"
      operationId: softDeleteOwning_subsystem
      tags:
        - owning_subsystem
      parameters:
        - name: id
          in:
            path
          required:
            true
          description:
            "Row id (uuid, or smallint for owning_subsystem)"
          schema:
            type: integer
            format: int32
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - table
                  - id
                  - deleted
                properties:
                  table:
                    type: string
                    enum:
                      - owning_subsystem
                  id:
                    type: integer
                    format: int32
                  deleted:
                    type: integer
                    description: "1 on first delete, 0 if already expired/missing"
        500:
          description: soft_delete_failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
