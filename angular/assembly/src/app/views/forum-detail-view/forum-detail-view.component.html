<div class="max-w-5xl mx-auto">
  <app-table-skeleton *ngIf="loading()" [cols]="3" [rows]="6"></app-table-skeleton>

  <app-error-state *ngIf="error() && !loading()" title="Failed to load forum" [description]="error()!" (retry)="retry()"></app-error-state>

  <ng-container *ngIf="!loading() && !error() && forum()">
    <app-page-header [title]="forum()!.name" [description]="forum()!.description" [count]="threads().length" [showAction]="true" actionLabel="New Thread" (action)="toggleNewThread()"></app-page-header>

    <!-- New Thread Form -->
    <div *ngIf="showNewThread()" class="app-panel p-4 mb-4 border-primary-300 dark:border-primary-700">
      <h3 class="text-sm font-semibold text-gray-900 dark:text-gray-100 mb-3">Create a new thread</h3>
      <div class="space-y-3">
        <div>
          <label for="new-thread-title" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Title</label>
          <input
            id="new-thread-title"
            type="text"
            [(ngModel)]="newThreadTitle"
            class="w-full rounded border border-gray-200 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-100 px-2 py-1.5 text-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 outline-none"
            placeholder="Thread title"
            required
          />
        </div>
        <div>
          <label for="new-thread-body" class="block text-xs font-medium text-gray-700 dark:text-gray-300 mb-1">Body</label>
          <textarea
            id="new-thread-body"
            [(ngModel)]="newThreadBody"
            rows="4"
            class="w-full resize-none rounded border border-gray-200 dark:border-gray-600 dark:bg-gray-900 dark:text-gray-100 px-2 py-1.5 text-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 outline-none"
            placeholder="Optional body content..."
          ></textarea>
        </div>
        <div *ngIf="submitError()" class="text-xs text-red-600 dark:text-red-400 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-900/30 rounded px-3 py-2">{{ submitError() }}</div>
        <div class="flex items-center justify-end gap-2">
          <button type="button" (click)="toggleNewThread()" class="px-3 py-1.5 text-xs font-medium text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-gray-200 transition-colors">Cancel</button>
          <button
            (click)="submitNewThread()"
            [disabled]="submitting() || !newThreadTitle.trim() || !newThreadBody.trim()"
            class="inline-flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-white bg-primary-600 hover:bg-primary-700 disabled:opacity-50 disabled:cursor-not-allowed rounded transition-colors"
          >
            <svg *ngIf="submitting()" class="animate-spin h-3.5 w-3.5" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            {{ submitting() ? 'Posting...' : 'Create Thread' }}
          </button>
        </div>
      </div>
    </div>

    <app-empty-state *ngIf="threads().length === 0" title="No threads" description="Publish the first thread to get the conversation started."></app-empty-state>

    <div *ngIf="threads().length > 0" class="app-panel overflow-hidden">
      <div class="overflow-x-auto">
      <table class="app-table">
        <thead>
          <tr>
            <th>Topic</th>
            <th class="w-24 text-center">Replies</th>
            <th class="w-40 text-right">Last Activity</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let thread of threads()" [routerLink]="['/forums', forum()!.slug, thread.id]" class="hover:cursor-pointer">
            <td>
              <div class="flex items-center gap-3">
                <app-avatar [name]="thread.author.name" [size]="32"></app-avatar>
                <div class="min-w-0">
                  <span class="app-link font-medium">{{ thread.title }}</span>
                  <div class="text-xs text-gray-400 mt-0.5">by {{ thread.author.name }} on {{ formatDate(thread.createdAt) }}</div>
                </div>
              </div>
            </td>
            <td class="text-center text-sm text-gray-500 dark:text-gray-400">{{ thread.replyCount }}</td>
            <td class="text-right text-xs text-gray-400">
              <app-time-ago *ngIf="thread.lastReplyAt" [date]="thread.lastReplyAt"></app-time-ago>
              <span *ngIf="!thread.lastReplyAt">—</span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    </div>
  </ng-container>
</div>
