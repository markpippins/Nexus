<div class="flex h-screen w-screen overflow-hidden bg-steel-50 text-steel-800 dark:bg-steel-900 dark:text-steel-200">
  <!-- Mobile sidebar overlay -->
  <div
    class="fixed inset-0 bg-black/40 z-40 lg:hidden transition-opacity duration-300 ease-in-out"
    [class.opacity-0]="!sidebarOpenMobile()"
    [class.opacity-100]="sidebarOpenMobile()"
    [class.pointer-events-none]="!sidebarOpenMobile()"
    (click)="closeMobileSidebar()"
    aria-hidden="true"
  ></div>

  <app-sidebar
    [collapsed]="sidebarCollapsed()"
    [counts]="counts()"
    [mobileOpen]="sidebarOpenMobile()"
    (closeMobile)="closeMobileSidebar()"
    class="hidden lg:flex"
  ></app-sidebar>

  <!-- Mobile sidebar -->
  <div
    class="fixed inset-y-0 left-0 z-50 w-64 lg:hidden transition-all duration-300 ease-in-out"
    [class.-translate-x-full]="!sidebarOpenMobile()"
    [class.translate-x-0]="sidebarOpenMobile()"
    [class.opacity-0]="!sidebarOpenMobile()"
    [class.opacity-100]="sidebarOpenMobile()"
    [class.pointer-events-none]="!sidebarOpenMobile()"
    [attr.aria-hidden]="!sidebarOpenMobile()"
  >
    <app-sidebar
      [collapsed]="false"
      [counts]="counts()"
      [mobileOpen]="true"
      (closeMobile)="closeMobileSidebar()"
    ></app-sidebar>
  </div>

  <div class="flex flex-col flex-1 min-w-0">
    <app-header
      [label]="currentRouteLabel()"
      [currentTheme]="currentTheme()"
      (toggleSidebar)="toggleSidebar()"
      (toggleMobileSidebar)="toggleMobileSidebar()"
      (toggleTheme)="toggleTheme()"
    ></app-header>
    <main class="flex-1 min-h-0 overflow-auto p-3 sm:p-4">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<app-toast></app-toast>
