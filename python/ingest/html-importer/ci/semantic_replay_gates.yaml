# ─────────────────────────────────────────────
# Plan 0016: CI Gate Specification
# ─────────────────────────────────────────────
#
# Encodes the closure-deletion safety system into machine-enforceable
# rules.  Phase transitions completed:
#   dual_oracle → projection_authority → projection_only → closure_deleted
#
# All closure artifacts (EnvelopeInterpreter_V1, ReconstructedClosureSet,
# closure_adapter, dual_oracle_harness) have been removed in
# Plan 0015 Phase 3. Only projection-based replay is active.
# ─────────────────────────────────────────────

pipeline: semantic_replay_validation

version: "1.0"

mode:
  phase: "projection_only"   # closure_deleted — legacy removed
  strictness: "high"

# ─────────────────────────────────────────────
# INPUT SPECIFICATION
# ─────────────────────────────────────────────

inputs:
  event_source:
    type: IR_EventEnvelope[]
    deterministic_ordering: true

  fixtures:
    type: ReplayFixture[]
    required: true
    source: tests/replay_fixtures.py

# ─────────────────────────────────────────────
# EXECUTION TARGETS
# ─────────────────────────────────────────────

execution:
  projection_system:
    enabled: true
    entrypoint: semantic_projection.SemanticProjectionBuilder

# ─────────────────────────────────────────────
# NORMALIZATION LAYER
# ─────────────────────────────────────────────

normalization:
  projection:
    enabled: true
    adapter: semantic_projection.SemanticProjectionBuilder

  canonical_form:
    type: SemanticProjection
    fields:
      - resolved_concepts
      - resolves_edges

# ─────────────────────────────────────────────
# CORE ASSERTION RULES
# ─────────────────────────────────────────────

assertions:

  # ── Dual oracle equivalence ─────────────────
  dual_oracle_equivalence:
    enabled: false
    note: "Legacy interpreter removed in Plan 0015 Phase 3"

  # ── Projection determinism ──────────────────
  projection_determinism:
    enabled: true
    rule: identical_runs_must_match

  # ── Closure influence prohibition ───────────
  closure_influence:
    enabled: true

    rules:
      - no_closure_in_fsm_path: true
      - no_closure_in_graph_reducer: true
      - no_closure_in_context_assembler: true
      - no_closure_in_projection_input: true

    failure_mode: fail_ci

  # ── Semantic drift detection ────────────────
  semantic_drift:
    enabled: true
    rule: zero_difference_for_covered_fixtures

    comparison:
      missing_concepts: fail_if_nonempty_on_covered
      extra_concepts: fail_unless_documented_gap
      missing_edges: fail_if_nonempty
      extra_edges: fail_if_nonempty

# ─────────────────────────────────────────────
# TRACE VALIDATION (RUNTIME INSTRUMENTATION)
# ─────────────────────────────────────────────

runtime_tracing:
  enabled: false
  note: "Closure tracing no longer needed — Plan 0015 Phase 3 complete"

# ─────────────────────────────────────────────
# ARTIFACT OUTPUTS
# ─────────────────────────────────────────────

artifacts:

  directory: artifacts/semantic_validation/

  outputs:
    - projection_drift_report.json
    - fixture_results.json
    - determinism_report.json

  retention:
    keep_last_n_runs: 50

# ─────────────────────────────────────────────
# GATING LOGIC BY PHASE
# ─────────────────────────────────────────────

gates:

  - phase: projection_only
    rules:
      - require_projection_execution: true
      - forbid_closure_imports: true
      - require_deterministic_2x_runs: true

# ─────────────────────────────────────────────
# ROLLBACK CONDITIONS
# ─────────────────────────────────────────────

rollback:

  triggers:
    - projection_nondeterminism_detected
    - resolved_concepts_regression > 15%

  action:
    revert_to_last_stable_tag
    preserve_artifacts: true

# ─────────────────────────────────────────────
# FINAL INVARIANTS (NON-NEGOTIABLE)
# ─────────────────────────────────────────────

invariants:
  - "SemanticProjection MUST be deterministic over identical inputs"
  - "Pipeline MUST produce resolved_concepts > 0 for conversations with extracted concepts"
  - "No closure-derived imports or types in replay pipeline"

# ─────────────────────────────────────────────
# COMPLETION CRITERIA
# ─────────────────────────────────────────────

completion:
  closure_deletion_verified:
    - all_closure_modules_removed: true
    - corpus_remains_deterministic: true
    - resolved_concepts_unchanged: true
    - no_closure_in_fsm_path: true
