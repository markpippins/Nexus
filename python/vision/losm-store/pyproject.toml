[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "losm-store"
version = "0.1.0"
description = "LOSM Store — persistence subsystem"
requires-python = ">=3.11"
dependencies = [
    "losm-ir",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
]

[tool.setuptools.packages.find]
where = ["src"]
