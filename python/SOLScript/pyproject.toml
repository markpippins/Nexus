[project]
name = "solscript"
version = "0.1.0"
description = "In-memory interpreter for the resolution schema language"
requires-python = ">=3.10"
dependencies = ["asyncpg>=0.29"]

[project.optional-dependencies]
dev = ["pyright>=1.1", "pytest>=8.0"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"
include = ["solscript"]
reportMissingTypeStubs = false
reportUnusedImport = false
reportUnusedVariable = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
