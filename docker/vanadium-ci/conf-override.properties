# Heap overrides for vd-ci-sonarqube (mounted over conf/sonar.properties).
# The lts-community entrypoint does not interpret SONAR_*_JAVAADDITIONALOPTS
# env vars; these properties are the canonical knobs (verified in-image 9.9.8).
sonar.web.javaAdditionalOpts=-Xmx1536m
sonar.search.javaAdditionalOpts=-Xmx512m
sonar.ce.javaAdditionalOpts=-Xmx512m
