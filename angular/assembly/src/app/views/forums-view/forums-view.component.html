<div class="max-w-6xl mx-auto">
  <app-page-header title="Forums" description="Join the discussion in one of our communities." [count]="forums().length"></app-page-header>

  <div *ngIf="loading()" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
    <div *ngFor="let _ of [1,2,3]" class="app-panel p-4 space-y-2">
      <app-skeleton width="60%" height="0.875rem"></app-skeleton>
      <app-skeleton width="90%" height="0.75rem"></app-skeleton>
      <app-skeleton width="40%" height="0.75rem"></app-skeleton>
    </div>
  </div>

  <app-error-state *ngIf="error() && !loading()" title="Failed to load forums" [description]="error()!" (retry)="retry()"></app-error-state>

  <ng-container *ngIf="!loading() && !error()">
    <app-empty-state *ngIf="forums().length === 0" title="No forums" description="Forums will appear here once they are created."></app-empty-state>

    <div *ngIf="forums().length > 0">
      <!-- Sort toolbar -->
      <div class="flex items-center gap-2 mb-3 px-1">
        <span class="text-[11px] font-medium text-steel-500 dark:text-steel-400 uppercase tracking-wider">Sort by</span>
        <button (click)="toggleSort('name')"
          class="inline-flex items-center gap-1 px-2 py-1 text-[11px] font-medium rounded border transition-colors"
          [class.bg-primary-50]="sortField() === 'name'"
          [class.text-primary-700]="sortField() === 'name'"
          [class.border-primary-200]="sortField() === 'name'"
          [class.text-steel-500]="sortField() !== 'name'"
          [class.border-steel-200]="sortField() !== 'name'"
          [class.hover:bg-steel-50]="sortField() !== 'name'">
          Name
          <span *ngIf="sortField() === 'name'" class="text-[10px]">{{ sortDir() === 'asc' ? '▲' : '▼' }}</span>
        </button>
        <button (click)="toggleSort('threadCount')"
          class="inline-flex items-center gap-1 px-2 py-1 text-[11px] font-medium rounded border transition-colors"
          [class.bg-primary-50]="sortField() === 'threadCount'"
          [class.text-primary-700]="sortField() === 'threadCount'"
          [class.border-primary-200]="sortField() === 'threadCount'"
          [class.text-steel-500]="sortField() !== 'threadCount'"
          [class.border-steel-200]="sortField() !== 'threadCount'"
          [class.hover:bg-steel-50]="sortField() !== 'threadCount'">
          Threads
          <span *ngIf="sortField() === 'threadCount'" class="text-[10px]">{{ sortDir() === 'asc' ? '▲' : '▼' }}</span>
        </button>
        <button (click)="toggleSort('postCount')"
          class="inline-flex items-center gap-1 px-2 py-1 text-[11px] font-medium rounded border transition-colors"
          [class.bg-primary-50]="sortField() === 'postCount'"
          [class.text-primary-700]="sortField() === 'postCount'"
          [class.border-primary-200]="sortField() === 'postCount'"
          [class.text-steel-500]="sortField() !== 'postCount'"
          [class.border-steel-200]="sortField() !== 'postCount'"
          [class.hover:bg-steel-50]="sortField() !== 'postCount'">
          Posts
          <span *ngIf="sortField() === 'postCount'" class="text-[10px]">{{ sortDir() === 'asc' ? '▲' : '▼' }}</span>
        </button>
        <button *ngIf="sortField()" (click)="toggleSort('')" class="ml-auto text-[11px] text-steel-400 hover:text-steel-600 dark:hover:text-steel-300 transition-colors">
          Clear sort
        </button>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div
        *ngFor="let forum of sortedForums()"
        [routerLink]="['/forums', forum.slug]"
        class="app-panel p-4 hover:shadow-soft hover:border-primary-300 hover:cursor-pointer transition-all duration-150 group"
      >
        <div class="flex items-start gap-3">
          <app-avatar [name]="forum.name" [size]="40"></app-avatar>
          <div class="flex-1 min-w-0">
            <h3 class="text-sm font-semibold text-gray-900 dark:text-gray-100 group-hover:text-primary-700 transition-colors">{{ forum.name }}</h3>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-1 line-clamp-2">{{ forum.description }}</p>
            <div class="flex items-center gap-3 mt-3 text-xs text-gray-400">
              <span>{{ forum.threadCount }} threads</span>
              <span>{{ forum.postCount }} posts</span>
            </div>
          </div>
        </div>

      </div>
      </div>
    </div>
  </ng-container>
</div>
