<div class="kanban-board">
  <!-- Columns -->
  <div class="columns">
    <div class="column" *ngFor="let col of columns()" [ngClass]="'column-' + col.color">
      <div class="column-header" [ngClass]="'header-' + col.color">
        <span class="column-label">{{ col.label }}</span>
        <span class="column-count" [ngClass]="'count-' + col.color">
          {{ getColumnPlans(col.key).length }}
        </span>
        <button
          *ngIf="col.key === 'archived'"
          class="toggle-archived"
          (click)="toggleArchived()"
        >
          {{ archivedExpanded() ? '▼' : '▶' }}
        </button>
      </div>
      <div class="column-body">
        <app-plan-card
          *ngFor="let plan of getColumnPlans(col.key)"
          [plan]="plan"
          [status]="col.key"
          (select)="selectedPlan.set(plan)"
        ></app-plan-card>
        <button
          *ngIf="col.key === 'archived' && archivedExpanded() && archivedRemaining() > 0"
          class="load-more-btn"
          (click)="loadMoreArchived()"
        >
          Load more ({{ archivedRemaining() }} remaining)
        </button>
      </div>
    </div>
  </div>

  <!-- Plan Detail panel -->
  <app-plan-detail
    *ngIf="selectedPlan()"
    [plan]="selectedPlan()"
    (close)="selectedPlan.set(null)"
  ></app-plan-detail>
</div>
