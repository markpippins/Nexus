# Atlas — Graph Views Service
spring.application.name=atlas

# Server
server.port=8090

# PostgreSQL Database (schema: registry — shared with service-registry)
spring.datasource.url=jdbc:postgresql://localhost:5432/nexus?currentSchema=registry
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=pguser
spring.datasource.password=pgpass

# JPA — Hibernate manages schema (matching service-registry pattern)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Flyway disabled — schema managed by Hibernate DDL auto-update
spring.flyway.enabled=false

# CORS (allow nexus-console dev server)
allowed.origins=*

# Logging
logging.level.com.aibizarchitect.nexus.v1.spring.atlas=INFO

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
