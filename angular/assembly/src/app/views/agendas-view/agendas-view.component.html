<div class="max-w-6xl mx-auto">
  <app-page-header title="Agendas" description="Deliberation agendas tracked across the Assembly." [count]="total()"></app-page-header>

  <app-table-skeleton *ngIf="loading()" [cols]="5" [rows]="6"></app-table-skeleton>

  <app-error-state *ngIf="error() && !loading()" title="Failed to load agendas" [description]="error()!" (retry)="retry()"></app-error-state>

  <ng-container *ngIf="!loading() && !error()">
    <app-empty-state *ngIf="items().length === 0" title="No agendas" description="Agendas will appear here once they are created."></app-empty-state>

    <div *ngIf="items().length > 0" class="app-panel">
      <div class="overflow-x-auto">
      <table class="app-table">
      <thead>
        <tr>
          <th>Title</th>
          <th class="w-28">Status</th>
          <th class="w-24">Sources</th>
          <th class="w-32">Created</th>
          <th class="w-28 text-right">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of items()">
          <td>
            <a [routerLink]="['/agendas', item.id]" class="app-link">{{ item.title }}</a>
            <div class="text-xs text-gray-500 dark:text-gray-400 line-clamp-1 mt-0.5">{{ item.scope || 'No scope' }}</div>
          </td>
          <td><app-status-badge [status]="item.status"></app-status-badge></td>
          <td class="text-sm text-gray-600 dark:text-gray-400">{{ item.sourceCount ?? '—' }}</td>
          <td class="text-xs text-gray-500 dark:text-gray-400">{{ formatDate(item.createdAt) }}</td>
          <td class="text-right"><app-raise-question objectType="agenda" [objectId]="item.id" [objectTitle]="item.title"></app-raise-question></td>
        </tr>
      </tbody>
      </table>
    </div>
    </div>
  </ng-container>
</div>
