<div class="max-w-6xl mx-auto">
  <app-page-header title="Observations" description="Captured observations from the system with trigger and payload context." [count]="total()"></app-page-header>

  <app-table-skeleton *ngIf="loading()" [cols]="5" [rows]="6"></app-table-skeleton>

  <app-error-state *ngIf="error() && !loading()" title="Failed to load observations" [description]="error()!" (retry)="retry()"></app-error-state>

  <ng-container *ngIf="!loading() && !error()">
    <app-empty-state *ngIf="items().length === 0" title="No observations" description="Observations will appear here once they are captured."></app-empty-state>

    <div *ngIf="items().length > 0" class="app-panel">
      <div *ngIf="sortField()" class="px-4 pt-2 pb-0">
        <button (click)="toggleSort('')" class="text-[11px] text-steel-400 hover:text-steel-600 dark:hover:text-steel-300 transition-colors">Clear sort</button>
      </div>
      <div class="overflow-x-auto">
      <table class="app-table">
      <thead>
        <tr>
          <th (click)="toggleSort('triggerType')" class="cursor-pointer hover:text-primary-600 select-none">Trigger Type <span *ngIf="sortField() === 'triggerType'" class="text-[10px]">{{ sortDir() === 'asc' ? '▲' : '▼' }}</span></th>
          <th>Payload Summary</th>
          <th (click)="toggleSort('sourceArtifactType')" class="w-28 cursor-pointer hover:text-primary-600 select-none">Source <span *ngIf="sortField() === 'sourceArtifactType'" class="text-[10px]">{{ sortDir() === 'asc' ? '▲' : '▼' }}</span></th>
          <th (click)="toggleSort('assessed')" class="w-20 cursor-pointer hover:text-primary-600 select-none">Assessed <span *ngIf="sortField() === 'assessed'" class="text-[10px]">{{ sortDir() === 'asc' ? '▲' : '▼' }}</span></th>
          <th class="w-28 text-right">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of sortedItems()">
          <td>
            <a [routerLink]="['/observations', item.id]" class="app-link font-medium">{{ item.triggerType }}</a>
          </td>
          <td class="text-xs text-gray-600 dark:text-gray-400 max-w-xs truncate">
            <span class="font-mono">{{ payloadSummary(item.payload) }}</span>
          </td>
          <td class="text-xs text-gray-600 dark:text-gray-400">{{ item.sourceArtifactType || '—' }}</td>
          <td>
            <app-status-badge [status]="item.assessed ? 'Assessed' : 'Pending'"></app-status-badge>
          </td>
          <td class="text-right"><app-raise-question objectType="observation" [objectId]="item.id" [objectTitle]="item.triggerType"></app-raise-question></td>
        </tr>
      </tbody>
      </table>
    </div>
      <app-pagination
        *ngIf="total() > pageSize"
        [currentPage]="currentPage()"
        [totalItems]="total()"
        [pageSize]="pageSize"
        (pageChange)="onPageChange($event)"
      ></app-pagination>
    </div>
  </ng-container>
</div>
