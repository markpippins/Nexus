<div class="max-w-6xl mx-auto">
  <app-page-header title="Open Questions" description="Questions that arise during requirement analysis." [count]="total()"></app-page-header>

  <app-table-skeleton *ngIf="loading()" [cols]="6" [rows]="6"></app-table-skeleton>

  <app-error-state *ngIf="error() && !loading()" title="Failed to load open questions" [description]="error()!" (retry)="retry()"></app-error-state>

  <ng-container *ngIf="!loading() && !error()">
    <app-empty-state *ngIf="items().length === 0" title="No open questions" description="Open questions will appear here once they are raised."></app-empty-state>

    <div *ngIf="items().length > 0" class="app-panel">
      <div class="overflow-x-auto">
      <table class="app-table">
      <thead>
        <tr>
          <th>Title</th>
          <th class="w-28">Category</th>
          <th class="w-24">Status</th>
          <th class="w-24">Blocking</th>
          <th class="w-32">Created</th>
          <th class="w-28 text-right">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of items()">
          <td>
            <a [routerLink]="['/open-questions', item.id]" class="app-link">{{ item.title }}</a>
            <div class="text-xs text-gray-500 dark:text-gray-400 line-clamp-1 mt-0.5">{{ item.description || 'No description' }}</div>
          </td>
          <td class="text-xs text-gray-600 dark:text-gray-400">{{ item.category }}</td>
          <td><app-status-badge [status]="item.status"></app-status-badge></td>
          <td class="text-xs text-gray-600 dark:text-gray-400">{{ item.blocking ? 'Yes' : 'No' }}</td>
          <td class="text-xs text-gray-500 dark:text-gray-400">{{ formatDate(item.createdAt) }}</td>
          <td class="text-right">
            <app-raise-question objectType="open_question" [objectId]="item.id" [objectTitle]="item.title"></app-raise-question>
          </td>
        </tr>
      </tbody>
      </table>
    </div>
    </div>
  </ng-container>
</div>
