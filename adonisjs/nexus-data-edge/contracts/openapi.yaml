openapi: 3.1.0
info:
  title: Nexus Data Edge
  version: 0.0.0
tags: []
paths:
  /health:
    get:
      operationId: health
      description: 'Edge health: status, service, db + redis connectivity.'
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Health:
      type: object
      required:
        - status
        - service
        - db
        - redis
        - timestamp
      properties:
        status:
          type: string
          description: Literal "ok" / "error".
        service:
          type: string
          description: '"nexus-data-edge".'
        db:
          type: string
          description: '"up" / error message.'
        redis:
          type: string
          description: '"up" / error message.'
        timestamp:
          type: string
          description: ISO timestamp.
      description: GET /health response.
