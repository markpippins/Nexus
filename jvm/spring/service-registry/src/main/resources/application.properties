# Broker Gateway Application Configuration
spring.application.name=spring-service-registry

# Server
server.port=8085

# H2 Database (file-based — persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/nexus;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# CORS
allowed.origins=*

# Logging
logging.level.com.aibizarchitect.nexus.v1.spring.broker.gateway=INFO
logging.level.org.springframework.web=INFO

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# OpenAPI / SpringDoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Redis / Cache
spring.cache.type=redis
