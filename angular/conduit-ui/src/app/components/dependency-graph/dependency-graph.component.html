<div class="graph-container" #container>
  <svg [attr.width]="svgWidth() * scale()" [attr.height]="svgHeight() * scale()"
       [style.transform]="'scale('+scale()+')'" style="transform-origin:0 0">
    <!-- Edges -->
    <ng-container *ngFor="let e of renderedEdges()">
      <line
        [attr.x1]="(getNodeX(e.from) + getNodeW(e.from) / 2) * scale()"
        [attr.y1]="(getNodeY(e.from) + getNodeH(e.from) / 2) * scale()"
        [attr.x2]="(getNodeX(e.to) + getNodeW(e.to) / 2) * scale()"
        [attr.y2]="(getNodeY(e.to) + getNodeH(e.to) / 2) * scale()"
        [attr.stroke]="hoveredNode() === e.from || hoveredNode() === e.to ? '#85c1e9' : '#5d6d7e'"
        [attr.opacity]="hoveredNode() && hoveredNode() !== e.from && hoveredNode() !== e.to ? 0.2 : 1"
        stroke-width="2" marker-end="url(#arrow)"
      />
    </ng-container>
    <!-- Arrow marker -->
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#5d6d7e"/>
      </marker>
    </defs>
    <!-- Prompt nodes -->
    <ng-container *ngFor="let n of allNodes()">
      @if (n.type === 'prompt') {
        <rect
          [attr.x]="n.x * scale()" [attr.y]="n.y * scale()"
          [attr.width]="120 * scale()" [attr.height]="30 * scale()"
          fill="#9b59b6"
          [attr.opacity]="hoveredNode() && hoveredNode() !== n.planNumber ? 0.3 : 1"
          rx="15" ry="15" cursor="pointer"
          (mouseenter)="hoveredNode.set(n.planNumber)" (mouseleave)="hoveredNode.set(null)"
        />
        <text [attr.x]="(n.x + 60) * scale()" [attr.y]="(n.y + 12) * scale()"
              font-size="10" fill="#fff" font-weight="bold" text-anchor="middle">💬 #{{n.planNumber}}</text>
        <text [attr.x]="(n.x + 60) * scale()" [attr.y]="(n.y + 25) * scale()"
              font-size="8" fill="rgba(255,255,255,0.7)" text-anchor="middle">{{n.title.slice(0,20)}}</text>
      }
    </ng-container>
    <!-- Plan nodes -->
    <ng-container *ngFor="let n of allNodes()">
      @if (n.type === 'plan') {
        <rect
          [attr.x]="n.x * scale()" [attr.y]="n.y * scale()"
          [attr.width]="140 * scale()" [attr.height]="40 * scale()"
          [attr.fill]="getStatusColor(n)"
          [attr.opacity]="hoveredNode() && hoveredNode() !== n.planNumber ? 0.3 : 1"
          rx="6" ry="6" cursor="pointer"
          (mouseenter)="hoveredNode.set(n.planNumber)" (mouseleave)="hoveredNode.set(null)"
        />
        <text [attr.x]="(n.x + 8) * scale()" [attr.y]="(n.y + 16) * scale()"
              font-size="11" fill="#fff" font-weight="bold">{{n.planNumber}}</text>
        <text [attr.x]="(n.x + 8) * scale()" [attr.y]="(n.y + 32) * scale()"
              font-size="9" fill="rgba(255,255,255,0.8)">{{n.title.slice(0,25)}}</text>
      }
    </ng-container>
  </svg>
  <!-- Legend -->
  <div class="legend">
    <span class="leg-item"><span class="leg-dot" style="background:#9b59b6"></span> Prompt</span>
    <span class="leg-item"><span class="leg-dot" style="background:#2ecc71"></span> Completed</span>
    <span class="leg-item"><span class="leg-dot" style="background:#3498db"></span> Active</span>
    <span class="leg-item"><span class="leg-dot" style="background:#f39c12"></span> Pending</span>
    <span class="leg-item"><span class="leg-dot" style="background:#e74c3c"></span> Blocked</span>
  </div>
  @if (allNodes().length === 0) {
    <app-empty-state icon="🔗" title="No dependency graph" description="Plans will appear here when they declare dependencies." />
  }
</div>
