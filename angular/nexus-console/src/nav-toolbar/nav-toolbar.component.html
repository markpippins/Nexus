<div class="nav-toolbar" [class.is-collapsed]="collapsed()">
  <!-- Nexus Orb at the top of the toolbar -->
  <app-orb class="orb-wrapper"></app-orb>
  <div class="nav-toolbar-divider"></div>

  @for (item of navItems; track $index) {
    @if (item.type === 'separator') {
      <div class="nav-toolbar-separator"></div>
    } @else {
      <button
        class="nav-toolbar-btn"
        [class.active]="viewMode() === item.key"
        [title]="item.title"
        (click)="viewModeChange.emit(item.key)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="nav-toolbar-icon"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.iconPath" />
        </svg>
      </button>
    }
  }

  <!-- Collapse / Expand Toggle (pinned to the bottom / right end) -->
  <button
    class="nav-toolbar-btn nav-toolbar-collapse-btn"
    [title]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    (click)="onCollapseToggle()"
  >
    @if (collapsed()) {
      <!-- Chevron-right: expand -->
      <svg xmlns="http://www.w3.org/2000/svg" class="nav-toolbar-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
      </svg>
    } @else {
      <!-- Chevron-left: collapse -->
      <svg xmlns="http://www.w3.org/2000/svg" class="nav-toolbar-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
      </svg>
    }
  </button>
</div>
