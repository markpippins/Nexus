<div class="max-w-4xl mx-auto">
  <div *ngIf="loading()" class="space-y-3">
    <div class="app-panel p-4 space-y-3">
      <app-skeleton width="40%" height="1rem"></app-skeleton>
      <app-skeleton width="20%" height="0.75rem"></app-skeleton>
      <app-skeleton width="100%" height="4rem"></app-skeleton>
    </div>
    <div *ngFor="let _ of [1,2]" class="app-panel p-3 space-y-2">
      <app-skeleton width="30%" height="0.75rem"></app-skeleton>
      <app-skeleton width="90%" height="0.875rem"></app-skeleton>
    </div>
  </div>

  <app-error-state *ngIf="error() && !loading()" title="Failed to load thread" [description]="error()!" (retry)="retry()"></app-error-state>

  <ng-container *ngIf="!loading() && !error() && thread()">
    <div class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400 mb-3">
      <a [routerLink]="['/forums']" class="hover:text-primary-700 transition-colors">Forums</a>
      <span>/</span>
      <a [routerLink]="['/forums', thread()!.forum.slug]" class="hover:text-primary-700 transition-colors">{{ thread()!.forum.name }}</a>
    </div>
    <div class="app-panel p-4 mb-4">
      <h1 class="text-lg font-bold text-gray-900 dark:text-gray-100">{{ thread()!.title }}</h1>
      <div class="flex items-center gap-2 mt-3">
        <app-avatar [name]="thread()!.author.name" [size]="32"></app-avatar>
        <div class="text-xs text-gray-500 dark:text-gray-400">
          <span class="font-medium text-gray-700 dark:text-gray-300">{{ thread()!.author.name }}</span>
          <app-time-ago [date]="thread()!.createdAt"></app-time-ago>
        </div>
      </div>
      <div class="mt-4">
        <app-markdown-renderer [content]="thread()!.body"></app-markdown-renderer>
      </div>
      <div class="mt-4">
        <app-raise-question objectType="thread" [objectId]="thread()!.id" [objectTitle]="thread()!.title"></app-raise-question>
      </div>
    </div>

    <h2 class="text-sm font-semibold text-gray-900 dark:text-gray-100 mb-2">Comments ({{ comments().length }})</h2>
    <app-empty-state *ngIf="comments().length === 0" title="No comments" description="Be the first to comment on this thread."></app-empty-state>
    <div class="space-y-3">
      <!-- Root comments -->
      <div *ngFor="let comment of rootComments()" class="app-panel p-3">
        <div class="flex items-center gap-2">
          <app-avatar [name]="comment.author.name" [size]="28"></app-avatar>
          <div class="text-xs text-gray-500 dark:text-gray-400">
            <span class="font-medium text-gray-700 dark:text-gray-300">{{ comment.author.name }}</span>
            <app-time-ago [date]="comment.createdAt"></app-time-ago>
          </div>
        </div>
        <div class="mt-1 ml-9">
          <app-markdown-renderer [content]="comment.body"></app-markdown-renderer>
          <button (click)="replyTo(comment)" class="mt-1.5 inline-flex items-center gap-1 text-[11px] text-gray-500 dark:text-gray-400 hover:text-primary-600 dark:hover:text-primary-300 transition-colors">
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
            </svg>
            Reply
          </button>
        </div>
        <!-- Child comments (threaded replies) -->
        <div *ngIf="childComments(comment.id).length > 0" class="ml-9 mt-2 space-y-2 border-l-2 border-gray-100 dark:border-gray-700 pl-3">
          <div *ngFor="let child of childComments(comment.id)" class="py-1.5">
            <div class="flex items-center gap-2">
              <app-avatar [name]="child.author.name" [size]="20"></app-avatar>
              <div class="text-xs text-gray-500 dark:text-gray-400">
                <span class="font-medium text-gray-700 dark:text-gray-300">{{ child.author.name }}</span>
                <app-time-ago [date]="child.createdAt"></app-time-ago>
              </div>
            </div>
            <div class="mt-1 ml-7">
              <app-markdown-renderer [content]="child.body"></app-markdown-renderer>
              <button (click)="replyTo(child)" class="mt-1 inline-flex items-center gap-1 text-[11px] text-gray-500 dark:text-gray-400 hover:text-primary-600 dark:hover:text-primary-300 transition-colors">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
                </svg>
                Reply
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="app-panel p-3 mt-4">
      <h3 class="text-xs font-semibold text-gray-500 dark:text-gray-400 uppercase mb-2">
        {{ replyToAuthor() ? 'Reply to ' + replyToAuthor() : 'Add a comment' }}
      </h3>
      <textarea [(ngModel)]="replyBody" placeholder="Write a reply..." rows="2" class="w-full resize-none rounded border border-gray-200 dark:border-gray-700 dark:bg-steel-900 dark:text-steel-100 p-2 text-sm focus:border-primary-500 focus:ring-1 focus:ring-primary-500 outline-none"></textarea>
      <div class="flex items-center justify-end gap-2 mt-2">
        <button *ngIf="replyToCommentId()" (click)="cancelReply()" class="text-xs text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-200 transition-colors">Cancel reply</button>
        <button (click)="submitReply()" [disabled]="!replyBody.trim()" class="app-btn-primary disabled:opacity-50 disabled:cursor-not-allowed">
          {{ replyToCommentId() ? 'Post Reply' : 'Post Comment' }}
        </button>
      </div>
    </div>
  </ng-container>
</div>
