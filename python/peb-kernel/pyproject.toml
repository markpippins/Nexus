[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-peb-kernel"
version = "0.1.0"
description = "Python Persistent Engineering Brain governance kernel"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "psycopg2-binary>=2.9",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
