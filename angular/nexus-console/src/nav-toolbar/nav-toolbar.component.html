<div class="nav-toolbar" [class.is-collapsed]="collapsed()">
  <!-- Nexus Orb at the top of the toolbar -->
  <app-orb class="orb-wrapper"></app-orb>
  <div class="nav-toolbar-divider"></div>

  @for (item of navItems; track $index) {
    @if (item.type === 'separator') {
      <div class="nav-toolbar-separator"></div>
    } @else {
      <button
        class="nav-toolbar-btn"
        [class.active]="viewMode() === item.key"
        [title]="item.title"
        (click)="viewModeChange.emit(item.key)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="nav-toolbar-icon"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" [attr.d]="item.iconPath" />
        </svg>
      </button>
    }
  }

  <!-- Spacer pushes theme toggle to the bottom -->
  <div class="nav-toolbar-spacer"></div>

  <!-- Theme Toggle (three-state: steel → light → dark) -->
  @if (!collapsed()) {
  <button
    class="nav-toolbar-btn nav-toolbar-theme-btn"
    [title]="'Theme: ' + (theme() === 'theme-steel' ? 'Steel' : theme() === 'theme-light' ? 'Light' : 'Dark')"
    (click)="toggleTheme()"
  >
    @switch (theme()) {
      @case ('theme-light') {
        <!-- Sun icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="nav-toolbar-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2.25m6.364.386l-1.591 1.591M21 12h-2.25m-.386 6.364l-1.591-1.591M12 18.75V21m-4.773-4.227l-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" />
        </svg>
      }
      @case ('theme-dark') {
        <!-- Moon icon -->
        <svg xmlns="http://www.w3.org/2000/svg" class="nav-toolbar-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z" />
        </svg>
      }
      @default {
        <!-- Steel icon: compass/crosshair -->
        <svg xmlns="http://www.w3.org/2000/svg" class="nav-toolbar-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 6.75V15m6-6v8.25m.503 3.498l4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934c-.317.159-.69.159-1.006 0L9.503 3.252a1.125 1.125 0 00-1.006 0L3.622 5.689C3.24 5.88 3 6.27 3 6.695V19.18c0 .836.88 1.38 1.628 1.006l3.869-1.934c.317-.159.69-.159 1.006 0l4.994 2.497c.317.158.69.158 1.006 0z" />
        </svg>
      }
    }
  </button>
  }

  <!-- Collapse / Expand Toggle (pinned to the bottom / right end) -->
  <button
    class="nav-toolbar-btn nav-toolbar-collapse-btn"
    [title]="collapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    (click)="onCollapseToggle()"
  >
    @if (collapsed()) {
      <!-- Chevron-right: expand -->
      <svg xmlns="http://www.w3.org/2000/svg" class="nav-toolbar-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
      </svg>
    } @else {
      <!-- Chevron-left: collapse -->
      <svg xmlns="http://www.w3.org/2000/svg" class="nav-toolbar-icon" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
      </svg>
    }
  </button>
</div>
