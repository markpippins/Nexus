# Broker Gateway Application Configuration
spring.application.name=spring-service-registry

# Server
server.port=8085

# PostgreSQL Database (schema: registry)
spring.datasource.url=jdbc:postgresql://localhost:5432/nexus?currentSchema=registry
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=pguser
spring.datasource.password=pgpass

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# CORS
allowed.origins=*

# Logging
logging.level.com.aibizarchitect.nexus.v1.spring.broker.gateway=INFO
logging.level.org.springframework.web=INFO

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# OpenAPI / SpringDoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Redis / Cache
spring.cache.type=redis
