# Broker Gateway Application Configuration
spring.application.name=spring-service-registry

# Server
server.port=8085

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/service_registry?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=rootpass

# JPA
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# CORS
allowed.origins=*

# Logging
logging.level.com.aibizarchitect.nexus.v1.spring.broker.gateway=INFO
logging.level.org.springframework.web=INFO

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# OpenAPI / SpringDoc
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Redis / Cache
spring.cache.type=redis
