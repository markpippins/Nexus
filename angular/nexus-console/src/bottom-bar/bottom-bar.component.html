<div class="bottom-bar">
  <!-- Left: Status info -->
  <div class="bottom-bar-left">
    <span class="status-text">{{ statusInfo() }}</span>
    @if (statusCounts(); as counts) {
      <span class="status-separator">|</span>
      <span class="status-text text-subtle">{{ counts }}</span>
    }
  </div>

  <!-- Right: Action buttons (chat, aiconfig) + External site buttons -->
  <div class="bottom-bar-right">
    <div class="bottom-bar-actions">
      <div class="action-buttons">
        <button
          class="action-btn"
          title="New chat messagebox"
          (click)="openNewChat()"
        >
          @if (imageBaseUrl(); as baseUrl) {
            <img
              [src]="getSiteIconUrl('chat')"
              alt="Chat"
              class="action-btn-img"
              loading="lazy"
              (error)="onImageError($event)"
            />
          }
        </button>
        <button
          class="action-btn"
          title="AI Configuration"
          (click)="onAiconfigClick()"
        >
          @if (imageBaseUrl(); as baseUrl) {
            <img
              [src]="getSiteIconUrl('aiconfig')"
              alt="AI Config"
              class="action-btn-img"
              loading="lazy"
              (error)="onImageError($event)"
            />
          }
        </button>
      </div>
    </div>

    @for (site of externalSites; track site.url) {
      <button
        class="external-btn"
        [title]="site.url"
        (click)="openExternal(site.url)"
      >
        @if (imageBaseUrl(); as baseUrl) {
          <img
            [src]="getSiteIconUrl(site.shortName)"
            [alt]="site.name"
            class="external-btn-img"
            loading="lazy"
            (error)="onImageError($event)"
          />
        }
      </button>
    }
  </div>
</div>
