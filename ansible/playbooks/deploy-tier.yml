# deploy-tier.yml — sync code, render tier .env, bring the failover tier up.
# Idempotent: re-running converges (git no-op, .env unchanged, compose recreates
# only what changed). Run against the [vanadium] inventory group only.
---
- name: Deploy nexus failover tier on vanadium
  hosts: vanadium
  gather_facts: false
  vars:
    ansible_become: false

  tasks:
    - name: Wait for SSH to settle (Pi can stall during container-start storms)
      ansible.builtin.wait_for_connection:
        timeout: 180

    # NOTE: plain command-based sync — the git module trips over the repo's
    # broken/stale submodule registrations (angular/*), which the tier does
    # not need. reset --hard is intentional: vanadium is a managed deploy
    # target; local edits there are not preserved.
    - name: Fetch latest {{ nexus_branch }}
      ansible.builtin.command:
        cmd: git fetch origin {{ nexus_branch }}
        chdir: "{{ nexus_root }}"
      changed_when: false

    - name: Read local and remote HEADs
      ansible.builtin.command:
        cmd: "git rev-parse HEAD origin/{{ nexus_branch }}"
        chdir: "{{ nexus_root }}"
      changed_when: false
      register: heads

    - name: Fast-forward to origin/{{ nexus_branch }}
      ansible.builtin.command:
        cmd: git reset --hard origin/{{ nexus_branch }}
        chdir: "{{ nexus_root }}"
      when: heads.stdout_lines[0] != heads.stdout_lines[1]
      register: git_sync

    - name: Report repo state
      ansible.builtin.debug:
        msg: "repo at {{ git_sync.after | default('unchanged') }}"
      when: git_sync is not skipped

    - name: Render tier .env
      ansible.builtin.copy:
        dest: "{{ compose_dir }}/.env"
        mode: "0600"
        content: |
          # Managed by ansible (nexus/ansible/playbooks/deploy-tier.yml).
          # Manual edits will be overwritten on next deploy.
          {% for k, v in tier_env.items() %}
          {{ k }}={{ v }}
          {% endfor %}
      register: env_render

    - name: Build managed tier images ({{ build_services | join(', ') }})
      ansible.builtin.command:
        cmd: >-
          docker compose
          {% for f in compose_files %}-f {{ f }} {% endfor %}
          build {{ build_services | join(' ') }}
        chdir: "{{ compose_dir }}"
      environment:
        DOCKER_BUILDKIT: "1"
      register: compose_build

    # --no-build: full-context rebuilds are currently blocked by terrain-ts
    # (its prebuilt dist/node_modules are gitignored and absent from a fresh
    # clone — W2 backlog). Legacy images already on the host are reused;
    # flip to `up -d --build` once terrain source is recovered.
    - name: Bring up the tier (base manifest + W2 override)
      ansible.builtin.command:
        cmd: >-
          docker compose
          {% for f in compose_files %}-f {{ f }} {% endfor %}
          up -d --no-build --remove-orphans
        chdir: "{{ compose_dir }}"
      register: compose_up
      changed_when: compose_up.stdout != ''

    - name: Prune dangling images from rebuilds
      ansible.builtin.command:
        cmd: docker image prune -f
      changed_when: false

    - name: Wait for containers to reach running/healthy
      ansible.builtin.pause:
        seconds: 45
      when: compose_up is changed
