# Google Search API — set via env vars GOOGLE_SEARCH_API_KEY / GOOGLE_SEARCH_ENGINE_ID
# (provided by nexus/.env → EnvironmentFile in broker-gateway.service)
# Spring Boot relaxed binding: GOOGLE_SEARCH_API_KEY → google.search.api.key
google.search.api.key=${GOOGLE_SEARCH_API_KEY:}
google.search.engine.id=${GOOGLE_SEARCH_ENGINE_ID:}

# YouTube Search API — set via env var GOOGLE_SEARCH_API_KEY (shared with Google Search)
youtube.api.key=${GOOGLE_SEARCH_API_KEY:}
