<div class="max-w-6xl mx-auto">
  <app-page-header title="Reports" description="Agent reports, analyses, assessments, and inspections." [count]="total()"></app-page-header>

  <app-table-skeleton *ngIf="loading()" [cols]="5" [rows]="6"></app-table-skeleton>

  <app-error-state *ngIf="error() && !loading()" title="Failed to load reports" [description]="error()!" (retry)="retry()"></app-error-state>

  <ng-container *ngIf="!loading() && !error()">
    <app-empty-state *ngIf="items().length === 0" title="No reports" description="Reports will appear here once they are generated."></app-empty-state>

    <div *ngIf="items().length > 0" class="app-panel">
      <div class="overflow-x-auto">
      <table class="app-table">
      <thead>
        <tr>
          <th>Title</th>
          <th class="w-24">Type</th>
          <th class="w-24">Role</th>
          <th class="w-32">Created</th>
          <th class="w-28 text-right">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of items()">
          <td>
            <a [routerLink]="['/reports', item.id]" class="app-link">{{ item.title || 'Untitled' }}</a>
            <div class="text-xs text-gray-500 dark:text-gray-400 line-clamp-1 mt-0.5">{{ item.content || 'No content' }}</div>
          </td>
          <td class="text-xs text-gray-600 dark:text-gray-400">{{ item.recordType || '—' }}</td>
          <td class="text-xs text-gray-600 dark:text-gray-400">{{ item.role || '—' }}</td>
          <td class="text-xs text-gray-500 dark:text-gray-400">{{ formatDate(item.createdAt) }}</td>
          <td class="text-right"><app-raise-question objectType="report" [objectId]="item.id" [objectTitle]="item.title || 'Untitled'"></app-raise-question></td>
        </tr>
      </tbody>
      </table>
    </div>
    </div>
  </ng-container>
</div>
