<div class="max-w-6xl mx-auto">
  <app-page-header title="Specifications" description="Derived specifications from agendas." [count]="total()"></app-page-header>

  <app-table-skeleton *ngIf="loading()" [cols]="5" [rows]="6"></app-table-skeleton>

  <app-error-state *ngIf="error() && !loading()" title="Failed to load specifications" [description]="error()!" (retry)="retry()"></app-error-state>

  <ng-container *ngIf="!loading() && !error()">
    <app-empty-state *ngIf="items().length === 0" title="No specifications" description="Specifications will appear here once they are derived from agendas."></app-empty-state>

    <div *ngIf="items().length > 0" class="app-panel">
      <div class="overflow-x-auto">
      <table class="app-table">
      <thead>
        <tr>
          <th>Revision</th>
          <th class="w-28">Type</th>
          <th class="w-32">Valid From</th>
          <th class="w-32">Created</th>
          <th class="w-28 text-right">Action</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of items()">
          <td>
            <a [routerLink]="['/specifications', item.id]" class="app-link">Revision #{{ item.revisionNumber }}</a>
            <div class="text-xs text-gray-500 dark:text-gray-400 line-clamp-1 mt-0.5">{{ item.changeSummary || 'No summary' }}</div>
          </td>
          <td class="text-xs text-gray-600 dark:text-gray-400">{{ item.revisionType }}</td>
          <td class="text-xs text-gray-500 dark:text-gray-400">{{ formatDate(item.validFrom) }}</td>
          <td class="text-xs text-gray-500 dark:text-gray-400">{{ formatDate(item.createdAt) }}</td>
          <td class="text-right"><app-raise-question objectType="specification" [objectId]="item.id" [objectTitle]="'Revision #' + item.revisionNumber"></app-raise-question></td>
        </tr>
      </tbody>
      </table>
    </div>
    </div>
  </ng-container>
</div>
