@if (isOpen()) {
  <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-[rgb(var(--color-surface))] border border-[rgb(var(--color-border-base))] shadow-xl rounded-lg w-full max-w-sm flex flex-col">
      <div class="p-4 border-b border-[rgb(var(--color-border-base))] flex justify-between items-center">
        <h2 class="text-lg font-semibold text-[rgb(var(--color-text-prominent))]">Create User</h2>
        <button (click)="onCancel()" class="text-[rgb(var(--color-text-muted))] hover:text-[rgb(var(--color-text-base))] text-lg leading-none">&times;</button>
      </div>
      <div class="p-6">
        <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
          <div class="flex flex-col gap-1">
            <label class="text-sm font-medium text-[rgb(var(--color-text-prominent))]">Alias *</label>
            <input type="text" formControlName="alias"
              class="p-2 rounded border border-[rgb(var(--color-border-base))] bg-[rgb(var(--color-surface))] text-[rgb(var(--color-text-base))] focus:outline-none focus:ring-1 focus:ring-[rgb(var(--color-accent-ring))] focus:border-[rgb(var(--color-accent-ring))]"
              placeholder="Username" />
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-sm font-medium text-[rgb(var(--color-text-prominent))]">Email</label>
            <input type="email" formControlName="email"
              class="p-2 rounded border border-[rgb(var(--color-border-base))] bg-[rgb(var(--color-surface))] text-[rgb(var(--color-text-base))] focus:outline-none focus:ring-1 focus:ring-[rgb(var(--color-accent-ring))] focus:border-[rgb(var(--color-accent-ring))]"
              placeholder="user@example.com" />
          </div>
          <div class="flex flex-col gap-1">
            <label class="text-sm font-medium text-[rgb(var(--color-text-prominent))]">Password *</label>
            <input type="password" formControlName="identifier"
              class="p-2 rounded border border-[rgb(var(--color-border-base))] bg-[rgb(var(--color-surface))] text-[rgb(var(--color-text-base))] focus:outline-none focus:ring-1 focus:ring-[rgb(var(--color-accent-ring))] focus:border-[rgb(var(--color-accent-ring))]"
              placeholder="Password" />
          </div>
          <div class="flex items-center gap-2">
            <input type="checkbox" formControlName="admin" id="adminCheck"
              class="rounded border-[rgb(var(--color-border-base))] text-[rgb(var(--color-accent-solid-bg))] focus:ring-[rgb(var(--color-accent-ring))]" />
            <label for="adminCheck" class="text-sm text-[rgb(var(--color-text-base))]">Admin</label>
          </div>

          @if (error()) {
            <div class="text-sm text-red-500 p-2 rounded bg-red-500/10 border border-red-500/20">
              {{ error() }}
            </div>
          }
        </form>
      </div>
      <div class="p-4 border-t border-[rgb(var(--color-border-base))] flex justify-end gap-3">
        <button (click)="onCancel()"
          class="px-4 py-2 rounded border border-[rgb(var(--color-border-base))] text-[rgb(var(--color-text-base))] hover:bg-[rgb(var(--color-surface-muted))] transition-colors text-sm">
          Cancel
        </button>
        <button (click)="onSubmit()" [disabled]="form.invalid || isSaving()"
          class="px-4 py-2 rounded bg-[rgb(var(--color-accent-solid-bg))] text-white text-sm hover:bg-[rgb(var(--color-accent-hover))] disabled:opacity-50 transition-colors">
          @if (isSaving()) {
            Creating...
          } @else {
            Create
          }
        </button>
      </div>
    </div>
  </div>
}
