# Docker Compose for Nexus legacy services failover group
# These services will run as warm failover standbys on vanadium

version: '3.8'

services:
  # Primary service on original port
  conduit-srv:
    build:
      context: ./conduit-srv
      dockerfile: Dockerfile
    container_name: conduit-srv
    ports:
      - "3104:3104"
    environment:
      - CONDUIT_SRV_PORT=3104
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3104/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - ./conduit-srv:/app:ro
    restart: unless-stopped

  # Failover standby on alternate port
  conduit-srv-standby:
    build:
      context: ./conduit-srv
      dockerfile: Dockerfile
    container_name: conduit-srv-standby
    ports:
      - "3105:3104"  # Standby on port 3105
    environment:
      - CONDUIT_SRV_PORT=3104
      - FAILOVER_STANDBY=true
      - PRIMARY_SERVICE=conduit-srv
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3105/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - ./conduit-srv:/app:ro
    restart: unless-stopped

  # Assembly service - primary
  assembly-srv:
    build:
      context: ./assembly-srv
      dockerfile: Dockerfile
    container_name: assembly-srv
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - FAILOVER_STANDBY=false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - ./assembly-srv:/app:ro
    restart: unless-stopped

  # Assembly service - failover standby
  assembly-srv-standby:
    build:
      context: ./assembly-srv
      dockerfile: Dockerfile
    container_name: assembly-srv-standby
    ports:
      - "8081:8080"  # Failover on port 8081
    environment:
      - PORT=8080
      - FAILOVER_STANDBY=true
      - PRIMARY_SERVICE=assembly-srv
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - ./assembly-srv:/app:ro
    restart: unless-stopped

