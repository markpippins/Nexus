<div class="max-w-6xl mx-auto">
  <app-page-header title="Resolutions" description="Open questions that have been answered and resolved." [count]="total()"></app-page-header>

  <app-table-skeleton *ngIf="loading()" [cols]="5" [rows]="6"></app-table-skeleton>

  <app-error-state *ngIf="error() && !loading()" title="Failed to load resolutions" [description]="error()!" (retry)="retry()"></app-error-state>

  <ng-container *ngIf="!loading() && !error()">
    <app-empty-state *ngIf="items().length === 0" title="No resolutions yet" description="Resolved questions will appear here once open questions have answers."></app-empty-state>

    <div *ngIf="items().length > 0">
      <!-- Sort toolbar -->
      <div class="flex items-center gap-2 mb-2 px-1">
        <span class="text-[11px] font-medium text-steel-500 dark:text-steel-400 uppercase tracking-wider">Sort by</span>
        <button (click)="toggleSort('title')"
          class="inline-flex items-center gap-1 px-2 py-1 text-[11px] font-medium rounded border transition-colors"
          [class.bg-primary-50]="sortField() === 'title'"
          [class.text-primary-700]="sortField() === 'title'"
          [class.border-primary-200]="sortField() === 'title'"
          [class.text-steel-500]="sortField() !== 'title'"
          [class.border-steel-200]="sortField() !== 'title'"
          [class.hover:bg-steel-50]="sortField() !== 'title'">
          Title
          <span *ngIf="sortField() === 'title'" class="text-[10px]">{{ sortDir() === 'asc' ? '▲' : '▼' }}</span>
        </button>
        <button (click)="toggleSort('createdAt')"
          class="inline-flex items-center gap-1 px-2 py-1 text-[11px] font-medium rounded border transition-colors"
          [class.bg-primary-50]="sortField() === 'createdAt'"
          [class.text-primary-700]="sortField() === 'createdAt'"
          [class.border-primary-200]="sortField() === 'createdAt'"
          [class.text-steel-500]="sortField() !== 'createdAt'"
          [class.border-steel-200]="sortField() !== 'createdAt'"
          [class.hover:bg-steel-50]="sortField() !== 'createdAt'">
          Created
          <span *ngIf="sortField() === 'createdAt'" class="text-[10px]">{{ sortDir() === 'asc' ? '▲' : '▼' }}</span>
        </button>
        <button *ngIf="sortField()" (click)="toggleSort('')" class="ml-auto text-[11px] text-steel-400 hover:text-steel-600 dark:hover:text-steel-300 transition-colors">
          Clear sort
        </button>
      </div>

      <div class="app-panel">
      <div class="divide-y divide-steel-200 dark:divide-steel-700">
        <div *ngFor="let item of sortedItems()" class="p-4 hover:bg-steel-50 dark:hover:bg-steel-800/50 transition-colors">
          <div class="flex items-start gap-3">
            <!-- Green checkmark icon -->
            <div class="flex-shrink-0 mt-0.5">
              <svg class="w-5 h-5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/>
                <path d="m9 12 2 2 4-4"/>
              </svg>
            </div>
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <a [routerLink]="['/open-questions', item.id]" class="text-sm font-medium text-steel-900 dark:text-steel-100 hover:text-primary-600 dark:hover:text-primary-400 transition-colors">
                  {{ item.title }}
                </a>
                <span class="text-[10px] font-medium px-1.5 py-0.5 rounded-full bg-emerald-100 dark:bg-emerald-900/30 text-emerald-700 dark:text-emerald-400">Resolved</span>
              </div>
              <div class="mt-1.5 flex items-center gap-3 text-[11px] text-steel-400 dark:text-steel-500">
                <span>{{ item.category }}</span>
                <ng-container *ngIf="entityRoute(item) as route">
                  <a [routerLink]="route" class="hover:text-primary-600 dark:hover:text-primary-400 hover:underline">{{ entityTitle(item) }}</a>
                </ng-container>
                <span>{{ formatDate(item.createdAt) }}</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <app-pagination
        *ngIf="total() > pageSize"
        [currentPage]="currentPage()"
        [totalItems]="total()"
        [pageSize]="pageSize"
        (pageChange)="onPageChange($event)"
      ></app-pagination>
    </div>
    </div>
  </ng-container>
</div>
