<div class="max-w-6xl mx-auto">
  <app-page-header title="Intent Records" description="Pre-canonical intent captures promoted from harvest candidates." [count]="total()"></app-page-header>

  <app-table-skeleton *ngIf="loading()" [cols]="4" [rows]="6"></app-table-skeleton>

  <app-error-state *ngIf="error() && !loading()" title="Failed to load intents" [description]="error()!" (retry)="retry()"></app-error-state>

  <ng-container *ngIf="!loading() && !error()">
    <app-empty-state *ngIf="items().length === 0" title="No intent records" description="Intent records will appear here once they are promoted from candidates."></app-empty-state>

    <div *ngIf="items().length > 0" class="app-panel">
      <div *ngIf="sortField()" class="px-4 pt-2 pb-0">
        <button (click)="toggleSort('')" class="text-[11px] text-steel-400 hover:text-steel-600 dark:hover:text-steel-300 transition-colors">Clear sort</button>
      </div>
      <div class="overflow-x-auto">
      <table class="app-table">
      <thead>
        <tr>
          <th (click)="toggleSort('title')" class="cursor-pointer hover:text-primary-600 select-none">Title <span *ngIf="sortField() === 'title'" class="text-[10px]">{{ sortDir() === 'asc' ? '▲' : '▼' }}</span></th>
          <th (click)="toggleSort('status')" class="w-28 cursor-pointer hover:text-primary-600 select-none">Status <span *ngIf="sortField() === 'status'" class="text-[10px]">{{ sortDir() === 'asc' ? '▲' : '▼' }}</span></th>
          <th (click)="toggleSort('createdAt')" class="w-32 cursor-pointer hover:text-primary-600 select-none">Created <span *ngIf="sortField() === 'createdAt'" class="text-[10px]">{{ sortDir() === 'asc' ? '▲' : '▼' }}</span></th>
          <th class="w-28 text-right">Action</th>
        </tr>
      </thead>
      <tbody>          <tr *ngFor="let item of sortedItems()">
            <td>
              <a [routerLink]="['/intents', item.id]" class="app-link">{{ item.title || 'Untitled' }}</a>
              <div class="flex items-center gap-2 mt-0.5">
                <span class="text-xs text-gray-500 dark:text-gray-400 line-clamp-1">{{ item.description || 'No description' }}</span>
                <a *ngIf="item.candidateId" [routerLink]="['/candidates', item.candidateId]" class="text-xs text-primary-600 dark:text-primary-400 hover:text-primary-700 dark:hover:text-primary-300 hover:underline whitespace-nowrap flex-shrink-0" (click)="$event.stopPropagation()">
                  → candidate
                </a>
              </div>
            </td>
            <td><app-status-badge [status]="item.status || 'unknown'"></app-status-badge></td>
            <td class="text-xs text-gray-500 dark:text-gray-400">{{ formatDate(item.createdAt) }}</td>
            <td class="text-right"><app-raise-question objectType="intent_record" [objectId]="item.id" [objectTitle]="item.title || 'Untitled'"></app-raise-question></td>
          </tr>
      </tbody>
      </table>
    </div>
      <app-pagination
        *ngIf="total() > pageSize"
        [currentPage]="currentPage()"
        [totalItems]="total()"
        [pageSize]="pageSize"
        (pageChange)="onPageChange($event)"
      ></app-pagination>
    </div>
  </ng-container>
</div>
