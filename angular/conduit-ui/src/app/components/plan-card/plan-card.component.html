<div
  class="plan-card"
  [ngClass]="'border-' + getStatusColor()"
  (click)="toggleExpanded()"
>
  <div class="card-header">
    <span class="plan-number" [ngClass]="'badge-' + getStatusColor()">
      {{ plan.planNumber }}
    </span>
    <span class="plan-age">{{ age() }}</span>
  </div>
  <div class="card-title">{{ plan.title }}</div>
  <div *ngIf="plan.blockReason" class="block-reason">
    ⚠ {{ getBlockReasonLabel(plan.blockReason) }}
  </div>
  <div *ngIf="status === 'completed'" class="completed-check">✓</div>

  <!-- Expanded detail panel -->
  <div *ngIf="expanded() && hasDetails()" class="card-detail" (click)="$event.stopPropagation()">
    <div class="detail-section" *ngIf="plan.goal">
      <div class="detail-label">Goal</div>
      <div class="detail-text">{{ plan.goal }}</div>
    </div>

    <div class="detail-section" *ngIf="plan.filesAffected && plan.filesAffected.length > 0">
      <div class="detail-label">Files Affected</div>
      <ul class="detail-list">
        <li *ngFor="let f of plan.filesAffected">
          <code>{{ f }}</code>
        </li>
      </ul>
    </div>

    <div class="detail-section" *ngIf="plan.acceptanceCriteria && plan.acceptanceCriteria.length > 0">
      <div class="detail-label">Acceptance Criteria</div>
      <ol class="detail-list">
        <li *ngFor="let c of plan.acceptanceCriteria">{{ c }}</li>
      </ol>
    </div>

    <div class="detail-section" *ngIf="plan.dependencies && plan.dependencies.length > 0">
      <div class="detail-label">Dependencies</div>
      <ul class="detail-list">
        <li *ngFor="let d of plan.dependencies">{{ d }}</li>
      </ul>
    </div>
  </div>
</div>
